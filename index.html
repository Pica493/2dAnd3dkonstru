<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SPROUT - A Gardener's Journey</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
#game { position: relative; width: 100vw; height: 100vh; }
canvas { display: block; }

/* HUD */
#hud { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; pointer-events: none; }
#hearts { display: flex; gap: 5px; margin-bottom: 10px; }
.heart { width: 30px; height: 30px; background: #ff4444; clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 80%, 18% 100%, 0% 35%); }
.heart.empty { background: #444; }

#energy-bar { width: 200px; height: 20px; background: #333; border: 2px solid #666; border-radius: 10px; overflow: hidden; }
#energy-fill { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); width: 100%; transition: width 0.3s; }

#wave-info { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 5px; font-size: 18px; font-weight: bold; }
#score { position: absolute; top: 70px; right: 20px; background: rgba(0,0,0,0.7); color: #FFD700; padding: 10px 20px; border-radius: 5px; font-size: 18px; font-weight: bold; }

#weapons { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
.weapon { width: 60px; height: 60px; background: rgba(0,0,0,0.7); border: 3px solid #666; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; cursor: pointer; pointer-events: auto; }
.weapon.active { border-color: #4CAF50; background: rgba(76,175,80,0.3); }
.weapon .cost { position: absolute; bottom: 2px; font-size: 10px; color: #aaa; }

#minimap { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 80px; background: rgba(0,0,0,0.7); border: 2px solid #666; border-radius: 5px; }

/* Меню */
#menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a3a2a 0%, #0d1f17 100%); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 10%; z-index: 100; }
#menu h1 { font-size: 80px; color: #8BC34A; margin-bottom: 10px; text-shadow: 3px 3px 6px rgba(0,0,0,0.5); }
#menu h2 { font-size: 20px; color: #aaa; margin-bottom: 40px; letter-spacing: 3px; }
.menu-btn { width: 300px; padding: 15px 30px; margin: 10px 0; background: linear-gradient(135deg, #8B6914 0%, #6B4E0A 100%); border: 3px solid #4a3508; border-radius: 10px; color: white; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
.menu-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #9B7924 0%, #7B5E1A 100%); }
#controls-info { position: absolute; bottom: 30px; left: 10%; color: #888; font-size: 14px; line-height: 1.6; }

/* Модальные окна */
.modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 200; }
.modal-content { background: #2a3a2a; padding: 40px; border-radius: 15px; max-width: 500px; width: 90%; }
.modal-content h2 { color: #8BC34A; margin-bottom: 20px; font-size: 28px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; color: white; }
.setting-row input[type="range"] { width: 150px; }
.setting-row input[type="checkbox"] { width: 20px; height: 20px; }
.close-btn { margin-top: 20px; padding: 10px 30px; background: #4CAF50; border: none; border-radius: 5px; color: white; font-size: 16px; cursor: pointer; }

#game-over { text-align: center; }
#game-over h2 { font-size: 36px; margin-bottom: 20px; }
#final-score { font-size: 48px; color: #FFD700; margin: 20px 0; }
</style>
</head>
<body>
<div id="game">
  <canvas id="gameCanvas"></canvas>
  
  <!-- HUD -->
  <div id="hud" style="display: none;">
    <div id="hearts"></div>
    <div id="energy-bar"><div id="energy-fill"></div></div>
  </div>
  <div id="wave-info" style="display: none;">ВОЛНА 1/10</div>
  <div id="score" style="display: none;">СЧЁТ: 0</div>
  
  <div id="weapons" style="display: none;">
    <div class="weapon active" data-weapon="0">🌿<div class="cost">0</div></div>
    <div class="weapon" data-weapon="1">🔫<div class="cost">4</div></div>
    <div class="weapon" data-weapon="2">💣<div class="cost">30</div></div>
  </div>
  
  <canvas id="minimap" style="display: none;"></canvas>

  <!-- Меню -->
  <div id="menu">
    <h1>SPROUT</h1>
    <h2>A GARDENER'S JOURNEY</h2>
    <button class="menu-btn" onclick="startGame()">▶ ИГРАТЬ</button>
    <button class="menu-btn" onclick="showSettings()">⚙ НАСТРОЙКИ</button>
    <button class="menu-btn" onclick="showCollection()">📖 КОЛЛЕКЦИЯ</button>
    <button class="menu-btn" onclick="exitGame()">🚪 ВЫХОД</button>
    <div id="controls-info">
      A/D — движение · W/Space — прыжок (двойной) · S — спрыгнуть<br>
      ЛКМ/J — атака · 1/2/3 — оружие · Esc — пауза
    </div>
  </div>

  <!-- Настройки -->
  <div id="settings" class="modal">
    <div class="modal-content">
      <h2>НАСТРОЙКИ</h2>
      <div class="setting-row">
        <label>Громкость</label>
        <input type="range" id="volume" min="0" max="100" value="70">
      </div>
      <div class="setting-row">
        <label>Музыка</label>
        <input type="checkbox" id="music" checked>
      </div>
      <div class="setting-row">
        <label>Тени</label>
        <input type="checkbox" id="shadows" checked>
      </div>
      <button class="close-btn" onclick="hideSettings()">ЗАКРЫТЬ</button>
    </div>
  </div>

  <!-- Коллекция -->
  <div id="collection" class="modal">
    <div class="modal-content">
      <h2>КОЛЛЕКЦИЯ</h2>
      <div id="collection-items"></div>
      <button class="close-btn" onclick="hideCollection()">ЗАКРЫТЬ</button>
    </div>
  </div>

  <!-- Пауза -->
  <div id="pause" class="modal">
    <div class="modal-content">
      <h2>ПАУЗА</h2>
      <button class="menu-btn" onclick="resumeGame()">ПРОДОЛЖИТЬ</button>
      <button class="menu-btn" onclick="restartGame()">ЗАНОВО</button>
      <button class="menu-btn" onclick="toMenu()">В МЕНЮ</button>
    </div>
  </div>

  <!-- Конец игры -->
  <div id="game-over" class="modal">
    <div class="modal-content">
      <h2 id="end-title">ИГРА ОКОНЧЕНА</h2>
      <div id="final-score">0</div>
      <button class="menu-btn" onclick="restartGame()">ЗАНОВО</button>
      <button class="menu-btn" onclick="toMenu()">В МЕНЮ</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Инициализация Three.js
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

// Освещение
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(50, 100, 50);
sunLight.castShadow = true;
sunLight.shadow.camera.left = -100;
sunLight.shadow.camera.right = 100;
sunLight.shadow.camera.top = 100;
sunLight.shadow.camera.bottom = -100;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
scene.add(sunLight);

// Игровые переменные
let gameState = 'menu';
let player, enemies = [], bullets = [], particles = [];
let platforms = [], pickups = [];
let score = 0, hearts = 5, energy = 100, currentWave = 1;
let currentWeapon = 0;
let keys = {};
let lastTime = 0;
let waveTimer = 0, spawnTimer = 0;
let unlockedEnemies = { sweep: false, trap: false };

// Создание игрока
function createPlayer() {
  const group = new THREE.Group();
  
  // Тело
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1.2, 0.6),
    new THREE.MeshStandardMaterial({ color: 0x8B7355 })
  );
  body.position.y = 0.6;
  body.castShadow = true;
  group.add(body);
  
  // Голова (купол)
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.7 })
  );
  head.position.y = 1.5;
  head.castShadow = true;
  group.add(head);
  
  // Глаза
  const eyeGeo = new THREE.BoxGeometry(0.15, 0.2, 0.1);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x90EE90, emissive: 0x90EE90, emissiveIntensity: 0.5 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.15, 1.5, 0.45);
  group.add(leftEye);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.15, 1.5, 0.45);
  group.add(rightEye);
  
  // Цветок на голове
  const flower = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFD700, emissiveIntensity: 0.3 })
  );
  flower.position.y = 2;
  group.add(flower);
  
  // Ноги
  const legGeo = new THREE.BoxGeometry(0.25, 0.6, 0.25);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x654321 });
  const leftLeg = new THREE.Mesh(legGeo, legMat);
  leftLeg.position.set(-0.2, -0.3, 0);
  leftLeg.castShadow = true;
  group.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, legMat);
  rightLeg.position.set(0.2, -0.3, 0);
  rightLeg.castShadow = true;
  group.add(rightLeg);
  
  // Руки
  const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
  const leftArm = new THREE.Mesh(armGeo, legMat);
  leftArm.position.set(-0.5, 0.6, 0);
  leftArm.castShadow = true;
  group.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, legMat);
  rightArm.position.set(0.5, 0.6, 0);
  rightArm.castShadow = true;
  group.add(rightArm);
  
  group.position.set(-20, 0, 0);
  scene.add(group);
  
  return {
    mesh: group,
    velocity: new THREE.Vector3(0, 0, 0),
    onGround: false,
    jumps: 0,
    facing: 1,
    invincible: 0,
    attackCooldown: 0
  };
}

// Создание платформ
function createPlatforms() {
  const platformData = [
    { x: -25, y: 0, w: 15, h: 1 },
    { x: -10, y: 2, w: 8, h: 0.5 },
    { x: 5, y: 0, w: 12, h: 1 },
    { x: 20, y: 3, w: 10, h: 0.5 },
    { x: 35, y: 0, w: 15, h: 1 },
    { x: 50, y: 2, w: 8, h: 0.5 },
    { x: -15, y: 4, w: 6, h: 0.5 },
    { x: 10, y: 5, w: 7, h: 0.5 },
    { x: 30, y: 4, w: 6, h: 0.5 }
  ];
  
  platformData.forEach(p => {
    const geometry = new THREE.BoxGeometry(p.w, p.h, 4);
    const material = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
    const platform = new THREE.Mesh(geometry, material);
    platform.position.set(p.x, p.y - p.h/2, 0);
    platform.receiveShadow = true;
    platform.castShadow = true;
    scene.add(platform);
    platforms.push({ mesh: platform, x: p.x, y: p.y, w: p.w, h: p.h });
    
    // Трава сверху
    const grass = new THREE.Mesh(
      new THREE.BoxGeometry(p.w + 0.2, 0.1, 4.2),
      new THREE.MeshStandardMaterial({ color: 0x228B22 })
    );
    grass.position.set(p.x, p.y, 0);
    scene.add(grass);
  });
}

// Создание врага
function createEnemy(type, x, y) {
  const group = new THREE.Group();
  
  if (type === 'sweep') {
    // Робот-уборщик
    const body = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0xB87333 })
    );
    body.position.y = 0.6;
    body.castShadow = true;
    group.add(body);
    
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xFF6600, emissive: 0xFF6600, emissiveIntensity: 0.5 })
    );
    eye.position.set(0, 0.7, 0.5);
    group.add(eye);
    
    const brush = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 0.1, 12),
      new THREE.MeshStandardMaterial({ color: 0x8B4513 })
    );
    brush.position.set(0.7, 0.3, 0);
    group.add(brush);
    
  } else if (type === 'trap') {
    // Хищный цветок
    const body = new THREE.Mesh(
      new THREE.ConeGeometry(0.5, 1, 8),
      new THREE.MeshStandardMaterial({ color: 0x8B0000 })
    );
    body.position.y = 0.5;
    body.castShadow = true;
    group.add(body);
    
    const mouth = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 8, 8, 0, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0xFF0000 })
    );
    mouth.position.set(0, 0.8, 0.3);
    mouth.rotation.x = -Math.PI / 2;
    group.add(mouth);
    
    const teeth = new THREE.Mesh(
      new THREE.ConeGeometry(0.05, 0.15, 4),
      new THREE.MeshStandardMaterial({ color: 0xFFFFFF })
    );
    teeth.position.set(0, 0.9, 0.6);
    group.add(teeth);
  }
  
  group.position.set(x, y, 0);
  scene.add(group);
  
  return {
    mesh: group,
    type: type,
    health: type === 'sweep' ? 3 : 5,
    velocity: new THREE.Vector3(0, 0, 0),
    onGround: false,
    attackCooldown: 0,
    facing: x > player.mesh.position.x ? -1 : 1
  };
}

// Создание пули
function createBullet(x, y, direction) {
  const bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x90EE90, emissive: 0x90EE90, emissiveIntensity: 1 })
  );
  bullet.position.set(x, y, 0);
  scene.add(bullet);
  
  bullets.push({
    mesh: bullet,
    velocity: new THREE.Vector3(direction * 15, 0, 0),
    life: 2
  });
}

// Создание частиц
function createParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const particle = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 0.1, 0.1),
      new THREE.MeshStandardMaterial({ color: color })
    );
    particle.position.set(x, y, 0);
    scene.add(particle);
    
    particles.push({
      mesh: particle,
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * 5,
        Math.random() * 5,
        (Math.random() - 0.5) * 2
      ),
      life: 1
    });
  }
}

// Создание пикапа
function createPickup(type, x, y) {
  const group = new THREE.Group();
  
  if (type === 'leaf') {
    const leaf = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0x90EE90, emissive: 0x90EE90, emissiveIntensity: 0.5 })
    );
    group.add(leaf);
  } else if (type === 'coin') {
    const coin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.2, 0.05, 12),
      new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFD700, emissiveIntensity: 0.3 })
    );
    coin.rotation.x = Math.PI / 2;
    group.add(coin);
  } else if (type === 'heart') {
    const heart = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.3, 0.1),
      new THREE.MeshStandardMaterial({ color: 0xFF4444 })
    );
    group.add(heart);
  }
  
  group.position.set(x, y, 0);
  scene.add(group);
  
  pickups.push({ mesh: group, type: type, y: y });
}

// Физика
function updatePhysics(delta) {
  if (!player) return;
  
  // Гравитация
  player.velocity.y -= 20 * delta;
  
  // Движение
  const speed = 8;
  if (keys['KeyA'] || keys['ArrowLeft']) {
    player.velocity.x = -speed;
    player.facing = -1;
  } else if (keys['KeyD'] || keys['ArrowRight']) {
    player.velocity.x = speed;
    player.facing = 1;
  } else {
    player.velocity.x *= 0.8;
  }
  
  // Прыжок
  if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.jumps < 2) {
    if (!player.jumpPressed) {
      player.velocity.y = 10;
      player.jumps++;
      player.jumpPressed = true;
      createParticles(player.mesh.position.x, player.mesh.position.y, 0x90EE90, 5);
    }
  } else {
    player.jumpPressed = false;
  }
  
  // Применение скорости
  player.mesh.position.x += player.velocity.x * delta;
  player.mesh.position.y += player.velocity.y * delta;
  
  // Коллизия с платформами
  player.onGround = false;
  platforms.forEach(p => {
    const px = player.mesh.position.x;
    const py = player.mesh.position.y;
    
    if (px > p.x - p.w/2 - 0.4 && px < p.x + p.w/2 + 0.4 &&
        py > p.y - 1.5 && py < p.y + 0.5 &&
        player.velocity.y <= 0) {
      player.mesh.position.y = p.y;
      player.velocity.y = 0;
      player.onGround = true;
      player.jumps = 0;
    }
  });
  
  // Падение
  if (player.mesh.position.y < -10) {
    hearts--;
    updateHearts();
    player.mesh.position.set(-20, 5, 0);
    player.velocity.set(0, 0, 0);
    if (hearts <= 0) endGame(false);
  }
  
  // Поворот
  player.mesh.rotation.y = player.facing > 0 ? 0 : Math.PI;
  
  // Анимация ходьбы
  if (Math.abs(player.velocity.x) > 0.5 && player.onGround) {
    player.mesh.children[3].rotation.x = Math.sin(Date.now() * 0.01) * 0.5;
    player.mesh.children[4].rotation.x = -Math.sin(Date.now() * 0.01) * 0.5;
  }
  
  // Неуязвимость
  if (player.invincible > 0) {
    player.invincible -= delta;
    player.mesh.visible = Math.floor(Date.now() / 100) % 2 === 0;
  } else {
    player.mesh.visible = true;
  }
  
  // Кулдаун атаки
  if (player.attackCooldown > 0) player.attackCooldown -= delta;
  
  // Обновление камеры
  camera.position.x = player.mesh.position.x;
  camera.position.y = player.mesh.position.y + 5;
  camera.position.z = 15;
  camera.lookAt(player.mesh.position.x, player.mesh.position.y, 0);
}

// Обновление врагов
function updateEnemies(delta) {
  enemies.forEach((enemy, index) => {
    // Гравитация
    enemy.velocity.y -= 20 * delta;
    
    // Движение к игроку
    const dx = player.mesh.position.x - enemy.mesh.position.x;
    const dist = Math.abs(dx);
    
    if (dist < 20) {
      enemy.facing = dx > 0 ? 1 : -1;
      const speed = enemy.type === 'sweep' ? 3 : 2;
      enemy.velocity.x = enemy.facing * speed;
    } else {
      enemy.velocity.x *= 0.8;
    }
    
    // Применение скорости
    enemy.mesh.position.x += enemy.velocity.x * delta;
    enemy.mesh.position.y += enemy.velocity.y * delta;
    
    // Коллизия с платформами
    enemy.onGround = false;
    platforms.forEach(p => {
      const ex = enemy.mesh.position.x;
      const ey = enemy.mesh.position.y;
      
      if (ex > p.x - p.w/2 - 0.6 && ex < p.x + p.w/2 + 0.6 &&
          ey > p.y - 1 && ey < p.y + 0.5 &&
          enemy.velocity.y <= 0) {
        enemy.mesh.position.y = p.y;
        enemy.velocity.y = 0;
        enemy.onGround = true;
      }
    });
    
    // Падение
    if (enemy.mesh.position.y < -10) {
      scene.remove(enemy.mesh);
      enemies.splice(index, 1);
      return;
    }
    
    // Поворот
    enemy.mesh.rotation.y = enemy.facing > 0 ? 0 : Math.PI;
    
    // Атака игрока
    if (dist < 1.5 && player.invincible <= 0) {
      hearts--;
      player.invincible = 2;
      updateHearts();
      createParticles(player.mesh.position.x, player.mesh.position.y + 1, 0xFF0000, 15);
      if (hearts <= 0) endGame(false);
    }
    
    // Кулдаун
    if (enemy.attackCooldown > 0) enemy.attackCooldown -= delta;
  });
}

// Обновление пуль
function updateBullets(delta) {
  bullets.forEach((bullet, index) => {
    bullet.mesh.position.add(bullet.velocity.clone().multiplyScalar(delta));
    bullet.life -= delta;
    
    // Коллизия с врагами
    enemies.forEach((enemy, eIndex) => {
      const dist = bullet.mesh.position.distanceTo(enemy.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0)));
      if (dist < 1) {
        enemy.health--;
        createParticles(enemy.mesh.position.x, enemy.mesh.position.y + 0.5, 0xFF6600, 8);
        
        if (enemy.health <= 0) {
          scene.remove(enemy.mesh);
          enemies.splice(eIndex, 1);
          score += enemy.type === 'sweep' ? 100 : 150;
          updateScore();
          
          // Шанс выпадения пикапа
          if (Math.random() < 0.5) {
            createPickup('leaf', enemy.mesh.position.x, enemy.mesh.position.y + 1);
          }
          if (Math.random() < 0.3) {
            createPickup('coin', enemy.mesh.position.x + 1, enemy.mesh.position.y + 1);
          }
        }
        
        scene.remove(bullet.mesh);
        bullets.splice(index, 1);
      }
    });
    
    if (bullet.life <= 0) {
      scene.remove(bullet.mesh);
      bullets.splice(index, 1);
    }
  });
}

// Обновление частиц
function updateParticles(delta) {
  particles.forEach((particle, index) => {
    particle.mesh.position.add(particle.velocity.clone().multiplyScalar(delta));
    particle.velocity.y -= 10 * delta;
    particle.life -= delta;
    particle.mesh.scale.multiplyScalar(0.95);
    
    if (particle.life <= 0) {
      scene.remove(particle.mesh);
      particles.splice(index, 1);
    }
  });
}

// Обновление пикапов
function updatePickups(delta) {
  pickups.forEach((pickup, index) => {
    pickup.mesh.position.y = pickup.y + Math.sin(Date.now() * 0.003) * 0.2;
    pickup.mesh.rotation.y += delta * 2;
    
    const dist = player.mesh.position.distanceTo(pickup.mesh.position);
    if (dist < 1.5) {
      if (pickup.type === 'leaf') {
        energy = Math.min(100, energy + 20);
        updateEnergy();
      } else if (pickup.type === 'coin') {
        score += 50;
        updateScore();
      } else if (pickup.type === 'heart') {
        hearts = Math.min(5, hearts + 1);
        updateHearts();
      }
      
      createParticles(pickup.mesh.position.x, pickup.mesh.position.y, 0x90EE90, 10);
      scene.remove(pickup.mesh);
      pickups.splice(index, 1);
    }
  });
}

// Атака
function attack() {
  if (player.attackCooldown > 0) return;
  
  if (currentWeapon === 0) {
    // Лоза - ближний бой
    player.attackCooldown = 0.5;
    const attackRange = 2;
    const attackX = player.mesh.position.x + player.facing * attackRange;
    
    enemies.forEach((enemy, index) => {
      const dist = Math.abs(enemy.mesh.position.x - attackX);
      if (dist < 1.5) {
        enemy.health--;
        createParticles(enemy.mesh.position.x, enemy.mesh.position.y + 0.5, 0x90EE90, 10);
        
        if (enemy.health <= 0) {
          scene.remove(enemy.mesh);
          enemies.splice(index, 1);
          score += enemy.type === 'sweep' ? 100 : 150;
          updateScore();
          
          if (Math.random() < 0.5) {
            createPickup('leaf', enemy.mesh.position.x, enemy.mesh.position.y + 1);
          }
        }
      }
    });
    
    createParticles(attackX, player.mesh.position.y + 1, 0x90EE90, 15);
    
  } else if (currentWeapon === 1) {
    // Сеятель - дальний бой
    if (energy >= 4) {
      energy -= 4;
      updateEnergy();
      player.attackCooldown = 0.2;
      createBullet(
        player.mesh.position.x + player.facing * 0.8,
        player.mesh.position.y + 1,
        player.facing
      );
    }
    
  } else if (currentWeapon === 2) {
    // Спора - взрыв
    if (energy >= 30) {
      energy -= 30;
      updateEnergy();
      player.attackCooldown = 1;
      
      const bombX = player.mesh.position.x + player.facing * 3;
      const bombY = player.mesh.position.y + 2;
      
      setTimeout(() => {
        createParticles(bombX, bombY, 0xFF6600, 30);
        
        enemies.forEach((enemy, index) => {
          const dist = Math.sqrt(
            Math.pow(enemy.mesh.position.x - bombX, 2) +
            Math.pow(enemy.mesh.position.y - bombY, 2)
          );
          
          if (dist < 4) {
            enemy.health -= 3;
            createParticles(enemy.mesh.position.x, enemy.mesh.position.y + 0.5, 0xFF6600, 15);
            
            if (enemy.health <= 0) {
              scene.remove(enemy.mesh);
              enemies.splice(index, 1);
              score += enemy.type === 'sweep' ? 100 : 150;
              updateScore();
            }
          }
        });
      }, 500);
      
      const bomb = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x4CAF50 })
      );
      bomb.position.set(bombX, bombY, 0);
      scene.add(bomb);
      setTimeout(() => scene.remove(bomb), 500);
    }
  }
}

// Волны
function updateWaves(delta) {
  if (gameState !== 'playing') return;
  
  waveTimer += delta;
  spawnTimer += delta;
  
  // Спавн врагов
  if (spawnTimer > 2 && enemies.length < 5) {
    spawnTimer = 0;
    const x = player.mesh.position.x + (Math.random() > 0.5 ? 25 : -25);
    const y = 5;
    
    const enemyType = Math.random() > 0.5 ? 'sweep' : 'trap';
    const enemy = createEnemy(enemyType, x, y);
    enemies.push(enemy);
    
    if (enemyType === 'sweep') unlockedEnemies.sweep = true;
    if (enemyType === 'trap') unlockedEnemies.trap = true;
  }
  
  // Следующая волна
  if (waveTimer > 30 && enemies.length === 0) {
    currentWave++;
    waveTimer = 0;
    updateWaveInfo();
    
    if (currentWave > 10) {
      endGame(true);
    } else {
      // Бонус между волнами
      energy = 100;
      updateEnergy();
      createPickup('heart', player.mesh.position.x + 3, player.mesh.position.y + 2);
    }
  }
}

// UI обновления
function updateHearts() {
  const heartsDiv = document.getElementById('hearts');
  heartsDiv.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart' + (i >= hearts ? ' empty' : '');
    heartsDiv.appendChild(heart);
  }
}

function updateEnergy() {
  document.getElementById('energy-fill').style.width = energy + '%';
}

function updateScore() {
  document.getElementById('score').textContent = 'СЧЁТ: ' + score;
}

function updateWaveInfo() {
  document.getElementById('wave-info').textContent = 'ВОЛНА ' + currentWave + '/10';
}

// Игровой цикл
function gameLoop(timestamp) {
  const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  
  if (gameState === 'playing') {
    updatePhysics(delta);
    updateEnemies(delta);
    updateBullets(delta);
    updateParticles(delta);
    updatePickups(delta);
    updateWaves(delta);
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(gameLoop);
}

// Управление
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  
  if (e.code === 'KeyJ' || e.code === 'Mouse0') {
    attack();
  }
  
  if (e.code === 'Digit1') setWeapon(0);
  if (e.code === 'Digit2') setWeapon(1);
  if (e.code === 'Digit3') setWeapon(2);
  
  if (e.code === 'Escape') {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0 && gameState === 'playing') {
    attack();
  }
});

// Выбор оружия
function setWeapon(weapon) {
  currentWeapon = weapon;
  document.querySelectorAll('.weapon').forEach((w, i) => {
    w.classList.toggle('active', i === weapon);
  });
}

document.querySelectorAll('.weapon').forEach((w, i) => {
  w.addEventListener('click', () => setWeapon(i));
});

// Игровые функции
function startGame() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('wave-info').style.display = 'block';
  document.getElementById('score').style.display = 'block';
  document.getElementById('weapons').style.display = 'flex';
  document.getElementById('minimap').style.display = 'block';
  
  gameState = 'playing';
  score = 0;
  hearts = 5;
  energy = 100;
  currentWave = 1;
  currentWeapon = 0;
  
  updateHearts();
  updateEnergy();
  updateScore();
  updateWaveInfo();
  setWeapon(0);
  
  // Очистка
  enemies.forEach(e => scene.remove(e.mesh));
  enemies = [];
  bullets.forEach(b => scene.remove(b.mesh));
  bullets = [];
  particles.forEach(p => scene.remove(p.mesh));
  particles = [];
  pickups.forEach(p => scene.remove(p.mesh));
  pickups = [];
  
  if (player) scene.remove(player.mesh);
  player = createPlayer();
  
  createPlatforms();
  
  lastTime = performance.now();
}

function pauseGame() {
  gameState = 'paused';
  document.getElementById('pause').style.display = 'flex';
}

function resumeGame() {
  gameState = 'playing';
  document.getElementById('pause').style.display = 'none';
  lastTime = performance.now();
}

function restartGame() {
  document.getElementById('pause').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  startGame();
}

function toMenu() {
  gameState = 'menu';
  document.getElementById('pause').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('wave-info').style.display = 'none';
  document.getElementById('score').style.display = 'none';
  document.getElementById('weapons').style.display = 'none';
  document.getElementById('minimap').style.display = 'none';
}

function endGame(won) {
  gameState = 'gameover';
  document.getElementById('end-title').textContent = won ? 'ПОБЕДА!' : 'ИГРА ОКОНЧЕНА';
  document.getElementById('final-score').textContent = score;
  document.getElementById('game-over').style.display = 'flex';
}

function showSettings() {
  document.getElementById('settings').style.display = 'flex';
}

function hideSettings() {
  document.getElementById('settings').style.display = 'none';
}

function showCollection() {
  const items = document.getElementById('collection-items');
  items.innerHTML = `
    <div style="color: white; margin: 10px 0;">
      <h3 style="color: #8BC34A;">🤖 Уборщик</h3>
      <p>${unlockedEnemies.sweep ? 'Разблокирован' : 'Заблокирован - победи врага'}</p>
    </div>
    <div style="color: white; margin: 10px 0;">
      <h3 style="color: #8BC34A;">🌺 Хищный цветок</h3>
      <p>${unlockedEnemies.trap ? 'Разблокирован' : 'Заблокирован - победи врага'}</p>
    </div>
  `;
  document.getElementById('collection').style.display = 'flex';
}

function hideCollection() {
  document.getElementById('collection').style.display = 'none';
}

function exitGame() {
  if (confirm('Выйти из игры?')) {
    window.close();
  }
}

// Настройки
document.getElementById('volume').addEventListener('input', (e) => {
  // Здесь можно добавить регулировку громкости
});

document.getElementById('music').addEventListener('change', (e) => {
  // Здесь можно добавить вкл/выкл музыки
});

document.getElementById('shadows').addEventListener('change', (e) => {
  renderer.shadowMap.enabled = e.target.checked;
});

// Ресайз
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Запуск
requestAnimationFrame(gameLoop);
</script>
