<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SPROUT - A Gardener's Journey</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
#game { position: relative; width: 100vw; height: 100vh; }
canvas { display: block; }

/* HUD */
#hud { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; pointer-events: none; z-index: 10; }
#hearts { display: flex; gap: 8px; margin-bottom: 12px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.heart { width: 32px; height: 32px; transition: all 0.3s; }
.heart svg { width: 100%; height: 100%; }
.heart.empty svg { fill: #444; stroke: #666; }
.heart.damaged svg { animation: heartBeat 0.5s; }

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

#energy-container { display: flex; align-items: center; gap: 10px; }
#energy-icon { width: 24px; height: 24px; }
#energy-bar { width: 220px; height: 24px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); border-radius: 12px; overflow: hidden; backdrop-filter: blur(5px); }
#energy-fill { height: 100%; background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 50%, #CDDC39 100%); width: 100%; transition: width 0.3s; box-shadow: 0 0 10px rgba(139,195,74,0.5); }

#wave-info { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 12px 24px; border-radius: 8px; font-size: 20px; font-weight: bold; backdrop-filter: blur(5px); border: 2px solid rgba(255,255,255,0.2); }
#score { position: absolute; top: 80px; right: 20px; background: rgba(0,0,0,0.7); color: #FFD700; padding: 12px 24px; border-radius: 8px; font-size: 20px; font-weight: bold; backdrop-filter: blur(5px); border: 2px solid rgba(255,215,0,0.3); }

#weapons { position: absolute; bottom: 30px; left: 30px; display: flex; gap: 12px; }
.weapon { width: 70px; height: 70px; background: rgba(0,0,0,0.7); border: 3px solid rgba(255,255,255,0.3); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; cursor: pointer; pointer-events: auto; transition: all 0.3s; backdrop-filter: blur(5px); position: relative; }
.weapon:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.6); }
.weapon.active { border-color: #4CAF50; background: rgba(76,175,80,0.3); box-shadow: 0 0 20px rgba(76,175,80,0.5); }
.weapon .icon { font-size: 28px; margin-bottom: 2px; }
.weapon .cost { font-size: 10px; color: #aaa; }
.weapon .key { position: absolute; top: 4px; left: 6px; font-size: 10px; color: #666; }

#minimap { position: absolute; bottom: 30px; right: 30px; width: 220px; height: 90px; background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; backdrop-filter: blur(5px); }

/* Меню */
#menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a3a2a 0%, #0d1f17 50%, #1a2a1f 100%); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 10%; z-index: 100; }
#menu::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 30% 50%, rgba(139,195,74,0.1) 0%, transparent 50%); pointer-events: none; }
#menu h1 { font-size: 90px; color: #8BC34A; margin-bottom: 10px; text-shadow: 4px 4px 8px rgba(0,0,0,0.7), 0 0 30px rgba(139,195,74,0.5); font-weight: 900; letter-spacing: 8px; position: relative; z-index: 1; }
#menu h2 { font-size: 22px; color: #aaa; margin-bottom: 50px; letter-spacing: 5px; position: relative; z-index: 1; }
.menu-btn { width: 320px; padding: 18px 35px; margin: 12px 0; background: linear-gradient(135deg, #8B6914 0%, #6B4E0A 100%); border: 3px solid #4a3508; border-radius: 12px; color: white; font-size: 22px; font-weight: bold; cursor: pointer; transition: all 0.3s; position: relative; z-index: 1; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.menu-btn:hover { transform: translateY(-3px) scale(1.02); background: linear-gradient(135deg, #9B7924 0%, #7B5E1A 100%); box-shadow: 0 8px 25px rgba(139,105,20,0.5); }
.menu-btn:active { transform: translateY(0) scale(0.98); }
#controls-info { position: absolute; bottom: 40px; left: 10%; color: #888; font-size: 15px; line-height: 1.8; position: relative; z-index: 1; }

/* Модальные окна */
.modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(10px); }
.modal-content { background: linear-gradient(135deg, #2a3a2a 0%, #1a2a1f 100%); padding: 45px; border-radius: 20px; max-width: 550px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.8); border: 2px solid rgba(139,195,74,0.3); }
.modal-content h2 { color: #8BC34A; margin-bottom: 25px; font-size: 32px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0; color: white; font-size: 16px; }
.setting-row input[type="range"] { width: 160px; height: 6px; }
.setting-row input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
.close-btn { margin-top: 25px; padding: 12px 35px; background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); border: none; border-radius: 8px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(76,175,80,0.4); }
.close-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(76,175,80,0.6); }

#game-over { text-align: center; }
#game-over h2 { font-size: 42px; margin-bottom: 25px; }
#final-score { font-size: 56px; color: #FFD700; margin: 25px 0; text-shadow: 0 0 20px rgba(255,215,0,0.5); }

/* Уведомления */
#notification { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 20px 40px; border-radius: 12px; font-size: 24px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 50; border: 2px solid #4CAF50; box-shadow: 0 0 30px rgba(76,175,80,0.5); }
#notification.show { opacity: 1; }
</style>
</head>
<body>
<div id="game">
  <canvas id="gameCanvas"></canvas>
  
  <!-- HUD -->
  <div id="hud" style="display: none;">
    <div id="hearts"></div>
    <div id="energy-container">
      <svg id="energy-icon" viewBox="0 0 24 24" fill="#8BC34A">
        <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
      </svg>
      <div id="energy-bar"><div id="energy-fill"></div></div>
    </div>
  </div>
  <div id="wave-info" style="display: none;">ВОЛНА 1/10</div>
  <div id="score" style="display: none;">СЧЁТ: 0</div>
  
  <div id="weapons" style="display: none;">
    <div class="weapon active" data-weapon="0">
      <div class="key">1</div>
      <div class="icon">🌿</div>
      <div class="cost">0</div>
    </div>
    <div class="weapon" data-weapon="1">
      <div class="key">2</div>
      <div class="icon">🔫</div>
      <div class="cost">4</div>
    </div>
    <div class="weapon" data-weapon="2">
      <div class="key">3</div>
      <div class="icon">💣</div>
      <div class="cost">30</div>
    </div>
  </div>
  
  <canvas id="minimap" style="display: none;"></canvas>

  <!-- Меню -->
  <div id="menu">
    <h1>SPROUT</h1>
    <h2>A GARDENER'S JOURNEY</h2>
    <button class="menu-btn" onclick="startGame()">▶ ИГРАТЬ</button>
    <button class="menu-btn" onclick="showSettings()">⚙ НАСТРОЙКИ</button>
    <button class="menu-btn" onclick="showCollection()">📖 КОЛЛЕКЦИЯ</button>
    <button class="menu-btn" onclick="exitGame()">🚪 ВЫХОД</button>
    <div id="controls-info">
      A/D — движение · W/Space — прыжок (двойной) · S — спрыгнуть<br>
      ЛКМ/J — атака · 1/2/3 — оружие · Esc — пауза
    </div>
  </div>

  <!-- Настройки -->
  <div id="settings" class="modal">
    <div class="modal-content">
      <h2>НАСТРОЙКИ</h2>
      <div class="setting-row">
        <label>Громкость</label>
        <input type="range" id="volume" min="0" max="100" value="70">
      </div>
      <div class="setting-row">
        <label>Музыка</label>
        <input type="checkbox" id="music" checked>
      </div>
      <div class="setting-row">
        <label>Тени</label>
        <input type="checkbox" id="shadows" checked>
      </div>
      <div class="setting-row">
        <label>Качество</label>
        <select id="quality" style="padding: 5px 10px; border-radius: 5px; background: #333; color: white; border: 1px solid #666;">
          <option value="high">Высокое</option>
          <option value="medium">Среднее</option>
          <option value="low">Низкое</option>
        </select>
      </div>
      <button class="close-btn" onclick="hideSettings()">ЗАКРЫТЬ</button>
    </div>
  </div>

  <!-- Коллекция -->
  <div id="collection" class="modal">
    <div class="modal-content">
      <h2>КОЛЛЕКЦИЯ</h2>
      <div id="collection-items"></div>
      <button class="close-btn" onclick="hideCollection()">ЗАКРЫТЬ</button>
    </div>
  </div>

  <!-- Пауза -->
  <div id="pause" class="modal">
    <div class="modal-content">
      <h2>ПАУЗА</h2>
      <button class="menu-btn" onclick="resumeGame()">ПРОДОЛЖИТЬ</button>
      <button class="menu-btn" onclick="restartGame()">ЗАНОВО</button>
      <button class="menu-btn" onclick="toMenu()">В МЕНЮ</button>
    </div>
  </div>

  <!-- Конец игры -->
  <div id="game-over" class="modal">
    <div class="modal-content">
      <h2 id="end-title">ИГРА ОКОНЧЕНА</h2>
      <div id="final-score">0</div>
      <button class="menu-btn" onclick="restartGame()">ЗАНОВО</button>
      <button class="menu-btn" onclick="toMenu()">В МЕНЮ</button>
    </div>
  </div>

  <!-- Уведомление -->
  <div id="notification"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==================== ИНИЦИАЛИЗАЦИЯ ====================
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ 
  canvas, 
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 20);

// Освещение
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(50, 100, 50);
sunLight.castShadow = true;
sunLight.shadow.camera.left = -100;
sunLight.shadow.camera.right = 100;
sunLight.shadow.camera.top = 100;
sunLight.shadow.camera.bottom = -100;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 500;
sunLight.shadow.bias = -0.0001;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x87CEEB, 0.3);
fillLight.position.set(-30, 20, -30);
scene.add(fillLight);

// ==================== ИГРОВЫЕ ПЕРЕМЕННЫЕ ====================
let gameState = 'menu';
let player, enemies = [], bullets = [], particles = [], platforms = [], pickups = [];
let score = 0, hearts = 5, energy = 100, currentWave = 1;
let currentWeapon = 0;
let keys = {};
let lastTime = 0;
let waveTimer = 0, spawnTimer = 0;
let unlockedEnemies = { sweep: false, trap: false };
let animationMixers = [];
let tweenAnimations = [];

// ==================== УТИЛИТЫ ====================
function createMaterial(color, roughness = 0.7, metalness = 0.1, emissive = 0x000000) {
  return new THREE.MeshStandardMaterial({ 
    color, 
    roughness, 
    metalness,
    emissive,
    emissiveIntensity: emissive !== 0x000000 ? 0.3 : 0
  });
}

function createGlowMaterial(color, intensity = 0.5) {
  return new THREE.MeshStandardMaterial({ 
    color, 
    emissive: color,
    emissiveIntensity: intensity,
    roughness: 0.3
  });
}

// ==================== СОЗДАНИЕ ИГРОКА ====================
function createPlayer() {
  const group = new THREE.Group();
  
  // Тело
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1.2, 0.6),
    createMaterial(0x8B7355, 0.8)
  );
  body.position.y = 0.6;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);
  
  // Детали тела
  const chest = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.5, 0.5),
    createMaterial(0x6B5345, 0.7)
  );
  chest.position.y = 0.7;
  chest.castShadow = true;
  group.add(chest);
  
  // Голова (купол)
  const headGroup = new THREE.Group();
  headGroup.position.y = 1.5;
  
  const headBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.45, 0.5, 0.3, 16),
    createMaterial(0x9B8B75, 0.6, 0.2)
  );
  headBase.castShadow = true;
  headGroup.add(headBase);
  
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshPhysicalMaterial({ 
      color: 0x87CEEB, 
      transparent: true, 
      opacity: 0.6,
      roughness: 0.1,
      metalness: 0.1,
      clearcoat: 1.0
    })
  );
  dome.position.y = 0.15;
  dome.castShadow = true;
  headGroup.add(dome);
  
  // Глаза
  const eyeGeo = new THREE.BoxGeometry(0.12, 0.18, 0.08);
  const eyeMat = createGlowMaterial(0x90EE90, 0.8);
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.15, 0.1, 0.45);
  headGroup.add(leftEye);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.15, 0.1, 0.45);
  headGroup.add(rightEye);
  
  // Цветок на голове
  const flowerGroup = new THREE.Group();
  flowerGroup.position.y = 0.5;
  
  const flowerCenter = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 8, 8),
    createGlowMaterial(0xFFD700, 0.6)
  );
  flowerGroup.add(flowerCenter);
  
  for (let i = 0; i < 5; i++) {
    const petal = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 6, 6),
      createMaterial(0xFFFFFF, 0.5)
    );
    const angle = (i / 5) * Math.PI * 2;
    petal.position.set(Math.cos(angle) * 0.15, 0, Math.sin(angle) * 0.15);
    petal.scale.y = 0.5;
    flowerGroup.add(petal);
  }
  headGroup.add(flowerGroup);
  
  group.add(headGroup);
  
  // Ноги
  const legGeo = new THREE.BoxGeometry(0.25, 0.6, 0.25);
  const legMat = createMaterial(0x654321, 0.8);
  const leftLeg = new THREE.Mesh(legGeo, legMat);
  leftLeg.position.set(-0.2, -0.3, 0);
  leftLeg.castShadow = true;
  group.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, legMat);
  rightLeg.position.set(0.2, -0.3, 0);
  rightLeg.castShadow = true;
  group.add(rightLeg);
  
  // Руки
  const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
  const leftArm = new THREE.Mesh(armGeo, legMat);
  leftArm.position.set(-0.5, 0.6, 0);
  leftArm.castShadow = true;
  group.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, legMat);
  rightArm.position.set(0.5, 0.6, 0);
  rightArm.castShadow = true;
  group.add(rightArm);
  
  // Хлыст (для анимации)
  const whip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, 2, 8),
    createMaterial(0x4CAF50, 0.6)
  );
  whip.position.set(0, 0, 0);
  whip.visible = false;
  group.add(whip);
  
  group.position.set(-20, 0, 0);
  scene.add(group);
  
  return {
    mesh: group,
    head: headGroup,
    leftLeg,
    rightLeg,
    leftArm,
    rightArm,
    whip,
    velocity: new THREE.Vector3(0, 0, 0),
    onGround: false,
    jumps: 0,
    facing: 1,
    invincible: 0,
    attackCooldown: 0,
    animState: 'idle',
    animTime: 0
  };
}

// ==================== СОЗДАНИЕ ПЛАТФОРМ ====================
function createPlatforms() {
  const platformData = [
    { x: -25, y: 0, w: 15, h: 1 },
    { x: -10, y: 2, w: 8, h: 0.5 },
    { x: 5, y: 0, w: 12, h: 1 },
    { x: 20, y: 3, w: 10, h: 0.5 },
    { x: 35, y: 0, w: 15, h: 1 },
    { x: 50, y: 2, w: 8, h: 0.5 },
    { x: -15, y: 4, w: 6, h: 0.5 },
    { x: 10, y: 5, w: 7, h: 0.5 },
    { x: 30, y: 4, w: 6, h: 0.5 }
  ];
  
  platformData.forEach(p => {
    const group = new THREE.Group();
    
    // Основная платформа
    const geometry = new THREE.BoxGeometry(p.w, p.h, 4);
    const material = createMaterial(0x8B7355, 0.9);
    const platform = new THREE.Mesh(geometry, material);
    platform.position.y = -p.h/2;
    platform.receiveShadow = true;
    platform.castShadow = true;
    group.add(platform);
    
    // Трава сверху
    const grass = new THREE.Mesh(
      new THREE.BoxGeometry(p.w + 0.2, 0.15, 4.2),
      createMaterial(0x4CAF50, 0.8)
    );
    grass.position.y = 0.075;
    grass.receiveShadow = true;
    group.add(grass);
    
    // Детали травы
    for (let i = 0; i < Math.floor(p.w); i++) {
      const grassBlade = new THREE.Mesh(
        new THREE.ConeGeometry(0.05, 0.2, 4),
        createMaterial(0x228B22, 0.7)
      );
      grassBlade.position.set(
        (Math.random() - 0.5) * p.w,
        0.2,
        (Math.random() - 0.5) * 3
      );
      group.add(grassBlade);
    }
    
    group.position.set(p.x, p.y, 0);
    scene.add(group);
    platforms.push({ mesh: group, x: p.x, y: p.y, w: p.w, h: p.h });
  });
  
  // Ямы (визуальные)
  const pitPositions = [
    { x: -5, width: 4 },
    { x: 25, width: 3 }
  ];
  
  pitPositions.forEach(pit => {
    const pitGeo = new THREE.BoxGeometry(pit.width, 2, 4);
    const pitMat = new THREE.MeshStandardMaterial({ 
      color: 0x1a1a1a, 
      roughness: 1,
      emissive: 0x000000
    });
    const pit = new THREE.Mesh(pitGeo, pitMat);
    pit.position.set(pit.x, -1, 0);
    pit.receiveShadow = true;
    scene.add(pit);
  });
}

// ==================== СОЗДАНИЕ ВРАГОВ ====================
function createEnemy(type, x, y) {
  const group = new THREE.Group();
  
  if (type === 'sweep') {
    // Робот-уборщик
    const body = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 12, 12),
      createMaterial(0xB87333, 0.6, 0.3)
    );
    body.position.y = 0.6;
    body.castShadow = true;
    group.add(body);
    
    // Глаз
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 8, 8),
      createGlowMaterial(0xFF6600, 0.8)
    );
    eye.position.set(0, 0.7, 0.5);
    group.add(eye);
    
    // Щётки
    const brushGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 12);
    const brushMat = createMaterial(0x8B4513, 0.9);
    const leftBrush = new THREE.Mesh(brushGeo, brushMat);
    leftBrush.position.set(-0.7, 0.3, 0);
    leftBrush.rotation.z = Math.PI / 2;
    group.add(leftBrush);
    const rightBrush = new THREE.Mesh(brushGeo, brushMat);
    rightBrush.position.set(0.7, 0.3, 0);
    rightBrush.rotation.z = Math.PI / 2;
    group.add(rightBrush);
    
    // Ноги
    const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.4, 8);
    const legMat = createMaterial(0x654321, 0.7);
    const leftLeg = new THREE.Mesh(legGeo, legMat);
    leftLeg.position.set(-0.3, 0.2, 0);
    group.add(leftLeg);
    const rightLeg = new THREE.Mesh(legGeo, legMat);
    rightLeg.position.set(0.3, 0.2, 0);
    group.add(rightLeg);
    
  } else if (type === 'trap') {
    // Хищный цветок
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.2, 1, 8),
      createMaterial(0x228B22, 0.8)
    );
    stem.position.y = 0.5;
    stem.castShadow = true;
    group.add(stem);
    
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 12, 12),
      createMaterial(0x8B0000, 0.6)
    );
    head.position.y = 1.2;
    head.castShadow = true;
    group.add(head);
    
    // Пасть
    const mouth = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2),
      createMaterial(0xFF0000, 0.5)
    );
    mouth.position.set(0, 1.2, 0.3);
    mouth.rotation.x = -Math.PI / 2;
    group.add(mouth);
    
    // Зубы
    for (let i = 0; i < 6; i++) {
      const tooth = new THREE.Mesh(
        new THREE.ConeGeometry(0.05, 0.15, 4),
        createMaterial(0xFFFFFF, 0.3)
      );
      const angle = (i / 6) * Math.PI * 2;
      tooth.position.set(
        Math.cos(angle) * 0.3,
        1.2,
        Math.sin(angle) * 0.3 + 0.3
      );
      tooth.rotation.x = -Math.PI / 4;
      group.add(tooth);
    }
    
    // Листья
    for (let i = 0; i < 3; i++) {
      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 8, 8),
        createMaterial(0x4CAF50, 0.7)
      );
      leaf.position.set(
        Math.cos(i * 2) * 0.4,
        0.8,
        Math.sin(i * 2) * 0.4
      );
      leaf.scale.y = 0.3;
      group.add(leaf);
    }
  }
  
  group.position.set(x, y, 0);
  scene.add(group);
  
  return {
    mesh: group,
    type: type,
    health: type === 'sweep' ? 3 : 5,
    maxHealth: type === 'sweep' ? 3 : 5,
    velocity: new THREE.Vector3(0, 0, 0),
    onGround: false,
    attackCooldown: 0,
    facing: x > player.mesh.position.x ? -1 : 1,
    animState: 'idle',
    animTime: 0,
    hitFlash: 0
  };
}

// ==================== ЧАСТИЦЫ И ЭФФЕКТЫ ====================
function createParticles(x, y, z, color, count = 10, speed = 5) {
  for (let i = 0; i < count; i++) {
    const size = Math.random() * 0.15 + 0.05;
    const particle = new THREE.Mesh(
      new THREE.BoxGeometry(size, size, size),
      createMaterial(color, 0.5, 0, color)
    );
    particle.position.set(x, y, z);
    scene.add(particle);
    
    particles.push({
      mesh: particle,
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * speed,
        Math.random() * speed,
        (Math.random() - 0.5) * speed * 0.5
      ),
      life: 1,
      decay: Math.random() * 0.5 + 0.5
    });
  }
}

function createExplosion(x, y, z, color, count = 30) {
  createParticles(x, y, z, color, count, 8);
  
  // Вспышка
  const flash = new THREE.PointLight(color, 2, 10);
  flash.position.set(x, y, z);
  scene.add(flash);
  
  setTimeout(() => {
    scene.remove(flash);
  }, 200);
}

// ==================== ПУЛИ И СНАРЯДЫ ====================
function createBullet(x, y, z, direction, type = 'normal') {
  let bullet;
  
  if (type === 'normal') {
    bullet = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 8, 8),
      createGlowMaterial(0x90EE90, 1)
    );
  } else if (type === 'bomb') {
    bullet = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 8, 8),
      createMaterial(0x4CAF50, 0.6, 0.2, 0x4CAF50)
    );
  }
  
  bullet.position.set(x, y, z);
  bullet.castShadow = true;
  scene.add(bullet);
  
  bullets.push({
    mesh: bullet,
    velocity: new THREE.Vector3(direction * 15, type === 'bomb' ? 8 : 0, 0),
    life: type === 'bomb' ? 1.5 : 2,
    type: type,
    gravity: type === 'bomb'
  });
}

// ==================== ПИКАПЫ ====================
function createPickup(type, x, y) {
  const group = new THREE.Group();
  
  if (type === 'leaf') {
    const leaf = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 8, 8),
      createGlowMaterial(0x90EE90, 0.8)
    );
    group.add(leaf);
    
    // Свечение
    const glow = new THREE.PointLight(0x90EE90, 0.5, 3);
    group.add(glow);
  } else if (type === 'coin') {
    const coin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.2, 0.05, 12),
      createGlowMaterial(0xFFD700, 0.6)
    );
    coin.rotation.x = Math.PI / 2;
    group.add(coin);
    
    const glow = new THREE.PointLight(0xFFD700, 0.5, 3);
    group.add(glow);
  } else if (type === 'heart') {
    const heart = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 8, 8),
      createMaterial(0xFF4444, 0.5, 0.2, 0xFF4444)
    );
    group.add(heart);
    
    const glow = new THREE.PointLight(0xFF4444, 0.5, 3);
    group.add(glow);
  }
  
  group.position.set(x, y, 0);
  scene.add(group);
  
  pickups.push({ mesh: group, type: type, y: y, time: 0 });
}

// ==================== АНИМАЦИИ ====================
function animatePlayerAttack(player) {
  player.animState = 'attack';
  player.animTime = 0;
  
  // Анимация удара хлыстом
  if (currentWeapon === 0) {
    player.whip.visible = true;
    player.whip.position.set(player.facing * 0.5, 0.6, 0);
    
    const whipAnimation = {
      target: player.whip,
      duration: 0.3,
      onUpdate: (t) => {
        player.whip.rotation.z = Math.sin(t * Math.PI) * 2 * player.facing;
        player.whip.position.x = player.facing * (0.5 + t * 1.5);
      },
      onComplete: () => {
        player.whip.visible = false;
        player.animState = 'idle';
      }
    };
    tweenAnimations.push(whipAnimation);
  }
}

function animatePlayerJump(player, isDouble = false) {
  player.animState = 'jump';
  player.animTime = 0;
  
  // Анимация прыжка
  const jumpAnimation = {
    target: player.mesh,
    duration: 0.3,
    onUpdate: (t) => {
      player.leftLeg.rotation.x = -0.5;
      player.rightLeg.rotation.x = -0.3;
      player.leftArm.rotation.x = -0.8;
      player.rightArm.rotation.x = -0.8;
    },
    onComplete: () => {
      if (player.onGround) player.animState = 'idle';
    }
  };
  tweenAnimations.push(jumpAnimation);
  
  // Эффект частиц
  createParticles(
    player.mesh.position.x,
    player.mesh.position.y,
    player.mesh.position.z,
    0x90EE90,
    isDouble ? 15 : 8,
    3
  );
}

function animateEnemyHit(enemy) {
  enemy.hitFlash = 0.3;
  enemy.animState = 'hit';
  enemy.animTime = 0;
  
  // Вспышка при попадании
  createParticles(
    enemy.mesh.position.x,
    enemy.mesh.position.y + 0.5,
    enemy.mesh.position.z,
    0xFF6600,
    10,
    4
  );
}

function animateEnemyDeath(enemy) {
  enemy.animState = 'death';
  enemy.animTime = 0;
  
  // Анимация смерти
  const deathAnimation = {
    target: enemy.mesh,
    duration: 1,
    onUpdate: (t) => {
      enemy.mesh.rotation.z = Math.sin(t * Math.PI) * 0.5;
      enemy.mesh.scale.y = 1 - t;
      enemy.mesh.position.y -= t * 0.01;
    },
    onComplete: () => {
      scene.remove(enemy.mesh);
      const index = enemies.indexOf(enemy);
      if (index > -1) enemies.splice(index, 1);
    }
  };
  tweenAnimations.push(deathAnimation);
  
  // Эффект смерти
  createExplosion(
    enemy.mesh.position.x,
    enemy.mesh.position.y + 0.5,
    enemy.mesh.position.z,
    enemy.type === 'sweep' ? 0xB87333 : 0x8B0000,
    20
  );
}

// ==================== ФИЗИКА ====================
function updatePhysics(delta) {
  if (!player) return;
  
  // Гравитация
  player.velocity.y -= 25 * delta;
  
  // Движение
  const speed = 8;
  if (keys['KeyA'] || keys['ArrowLeft']) {
    player.velocity.x = -speed;
    player.facing = -1;
  } else if (keys['KeyD'] || keys['ArrowRight']) {
    player.velocity.x = speed;
    player.facing = 1;
  } else {
    player.velocity.x *= 0.85;
  }
  
  // Прыжок
  if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.jumps < 2) {
    if (!player.jumpPressed) {
      player.velocity.y = 12;
      player.jumps++;
      player.jumpPressed = true;
      animatePlayerJump(player, player.jumps === 2);
    }
  } else {
    player.jumpPressed = false;
  }
  
  // Применение скорости
  player.mesh.position.x += player.velocity.x * delta;
  player.mesh.position.y += player.velocity.y * delta;
  
  // Коллизия с платформами (твёрдые)
  player.onGround = false;
  let onPlatform = false;
  
  platforms.forEach(p => {
    const px = player.mesh.position.x;
    const py = player.mesh.position.y;
    const halfW = p.w / 2;
    const playerBottom = py - 1.5;
    const playerTop = py;
    
    // Проверка горизонтального перекрытия
    if (px > p.x - halfW - 0.4 && px < p.x + halfW + 0.4) {
      // Приземление сверху
      if (playerBottom <= p.y && playerBottom >= p.y - 0.5 && player.velocity.y <= 0) {
        player.mesh.position.y = p.y + 1.5;
        player.velocity.y = 0;
        player.onGround = true;
        player.jumps = 0;
        onPlatform = true;
      }
      // Удар снизу
      else if (playerTop >= p.y + p.h && playerTop <= p.y + p.h + 0.3 && player.velocity.y > 0) {
        player.mesh.position.y = p.y + p.h - 0.01;
        player.velocity.y = 0;
      }
    }
  });
  
  // Падение в яму
  if (player.mesh.position.y < -5) {
    hearts--;
    updateHearts();
    player.mesh.position.set(-20, 5, 0);
    player.velocity.set(0, 0, 0);
    createExplosion(player.mesh.position.x, player.mesh.position.y, player.mesh.position.z, 0xFF0000, 30);
    
    if (hearts <= 0) endGame(false);
  }
  
  // Поворот
  player.mesh.rotation.y = player.facing > 0 ? 0 : Math.PI;
  
  // Анимация ходьбы
  if (Math.abs(player.velocity.x) > 0.5 && player.onGround) {
    const walkSpeed = 10;
    player.leftLeg.rotation.x = Math.sin(Date.now() * 0.01 * walkSpeed) * 0.6;
    player.rightLeg.rotation.x = -Math.sin(Date.now() * 0.01 * walkSpeed) * 0.6;
    player.leftArm.rotation.x = -Math.sin(Date.now() * 0.01 * walkSpeed) * 0.4;
    player.rightArm.rotation.x = Math.sin(Date.now() * 0.01 * walkSpeed) * 0.4;
  } else if (player.onGround) {
    player.leftLeg.rotation.x *= 0.9;
    player.rightLeg.rotation.x *= 0.9;
    player.leftArm.rotation.x *= 0.9;
    player.rightArm.rotation.x *= 0.9;
  }
  
  // Неуязвимость
  if (player.invincible > 0) {
    player.invincible -= delta;
    player.mesh.visible = Math.floor(Date.now() / 100) % 2 === 0;
  } else {
    player.mesh.visible = true;
  }
  
  // Кулдаун атаки
  if (player.attackCooldown > 0) player.attackCooldown -= delta;
  
  // Обновление камеры (2.5D стиль)
  const targetX = player.mesh.position.x;
  const targetY = player.mesh.position.y + 5;
  camera.position.x += (targetX - camera.position.x) * 0.1;
  camera.position.y += (targetY - camera.position.y) * 0.1;
  camera.position.z = 18;
  camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1, 0);
}

// ==================== ОБНОВЛЕНИЕ ВРАГОВ ====================
function updateEnemies(delta) {
  enemies.forEach((enemy, index) => {
    if (enemy.animState === 'death') return;
    
    // Гравитация
    enemy.velocity.y -= 25 * delta;
    
    // Движение к игроку
    const dx = player.mesh.position.x - enemy.mesh.position.x;
    const dist = Math.abs(dx);
    
    if (dist < 20 && player.invincible <= 0) {
      enemy.facing = dx > 0 ? 1 : -1;
      const speed = enemy.type === 'sweep' ? 3 : 2;
      enemy.velocity.x = enemy.facing * speed;
      enemy.animState = 'walk';
    } else {
      enemy.velocity.x *= 0.85;
      enemy.animState = 'idle';
    }
    
    // Применение скорости
    enemy.mesh.position.x += enemy.velocity.x * delta;
    enemy.mesh.position.y += enemy.velocity.y * delta;
    
    // Коллизия с платформами
    enemy.onGround = false;
    platforms.forEach(p => {
      const ex = enemy.mesh.position.x;
      const ey = enemy.mesh.position.y;
      const halfW = p.w / 2;
      
      if (ex > p.x - halfW - 0.6 && ex < p.x + halfW + 0.6) {
        if (ey <= p.y + 0.5 && ey >= p.y - 0.5 && enemy.velocity.y <= 0) {
          enemy.mesh.position.y = p.y;
          enemy.velocity.y = 0;
          enemy.onGround = true;
        }
      }
    });
    
    // Падение
    if (enemy.mesh.position.y < -10) {
      scene.remove(enemy.mesh);
      enemies.splice(index, 1);
      return;
    }
    
    // Поворот
    enemy.mesh.rotation.y = enemy.facing > 0 ? 0 : Math.PI;
    
    // Анимация ходьбы
    if (enemy.animState === 'walk') {
      const walkSpeed = 8;
      enemy.mesh.children.forEach((child, i) => {
        if (child.geometry && child.geometry.type === 'CylinderGeometry') {
          child.rotation.x = Math.sin(Date.now() * 0.01 * walkSpeed + i) * 0.3;
        }
      });
    }
    
    // Вспышка при попадании
    if (enemy.hitFlash > 0) {
      enemy.hitFlash -= delta;
      enemy.mesh.children.forEach(child => {
        if (child.material) {
          child.material.emissive.setHex(0xFFFFFF);
          child.material.emissiveIntensity = enemy.hitFlash * 3;
        }
      });
    } else {
      enemy.mesh.children.forEach(child => {
        if (child.material && child.material.emissive) {
          child.material.emissiveIntensity = child.material.userData?.baseEmissive || 0;
        }
      });
    }
    
    // Атака игрока
    if (dist < 1.5 && player.invincible <= 0 && enemy.animState !== 'death') {
      hearts--;
      player.invincible = 2;
      updateHearts();
      createExplosion(player.mesh.position.x, player.mesh.position.y + 1, player.mesh.position.z, 0xFF0000, 20);
      
      // Отбрасывание
      player.velocity.x = -enemy.facing * 8;
      player.velocity.y = 5;
      
      if (hearts <= 0) endGame(false);
    }
    
    // Кулдаун
    if (enemy.attackCooldown > 0) enemy.attackCooldown -= delta;
  });
}

// ==================== ОБНОВЛЕНИЕ ПУЛЬ ====================
function updateBullets(delta) {
  bullets.forEach((bullet, index) => {
    // Гравитация для бомб
    if (bullet.gravity) {
      bullet.velocity.y -= 20 * delta;
    }
    
    bullet.mesh.position.add(bullet.velocity.clone().multiplyScalar(delta));
    bullet.mesh.rotation.y += delta * 5;
    bullet.life -= delta;
    
    // Коллизия с врагами
    let hit = false;
    enemies.forEach((enemy, eIndex) => {
      if (enemy.animState === 'death') return;
      
      const dist = bullet.mesh.position.distanceTo(
        enemy.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0))
      );
      
      if (dist < 1) {
        enemy.health--;
        animateEnemyHit(enemy);
        
        if (enemy.health <= 0) {
          animateEnemyDeath(enemy);
          score += enemy.type === 'sweep' ? 100 : 150;
          updateScore();
          
          if (enemy.type === 'sweep') unlockedEnemies.sweep = true;
          if (enemy.type === 'trap') unlockedEnemies.trap = true;
          
          // Шанс выпадения пикапа
          if (Math.random() < 0.6) {
            createPickup('leaf', enemy.mesh.position.x, enemy.mesh.position.y + 1);
          }
          if (Math.random() < 0.3) {
            createPickup('coin', enemy.mesh.position.x + 1, enemy.mesh.position.y + 1);
          }
        }
        
        hit = true;
      }
    });
    
    // Коллизия с платформами для бомб
    if (bullet.type === 'bomb') {
      platforms.forEach(p => {
        const bx = bullet.mesh.position.x;
        const by = bullet.mesh.position.y;
        const halfW = p.w / 2;
        
        if (bx > p.x - halfW && bx < p.x + halfW && by <= p.y + 0.5 && by >= p.y - 0.5) {
          // Взрыв
          createExplosion(bx, by, 0, 0xFF6600, 40);
          
          // Урон врагам в радиусе
          enemies.forEach((enemy, eIndex) => {
            if (enemy.animState === 'death') return;
            const dist = Math.sqrt(
              Math.pow(enemy.mesh.position.x - bx, 2) +
              Math.pow(enemy.mesh.position.y - by, 2)
            );
            
            if (dist < 4) {
              enemy.health -= 3;
              animateEnemyHit(enemy);
              
              if (enemy.health <= 0) {
                animateEnemyDeath(enemy);
                score += enemy.type === 'sweep' ? 100 : 150;
                updateScore();
              }
            }
          });
          
          hit = true;
        }
      });
    }
    
    if (hit || bullet.life <= 0) {
      scene.remove(bullet.mesh);
      bullets.splice(index, 1);
    }
  });
}

// ==================== ОБНОВЛЕНИЕ ЧАСТИЦ ====================
function updateParticles(delta) {
  particles.forEach((particle, index) => {
    particle.mesh.position.add(particle.velocity.clone().multiplyScalar(delta));
    particle.velocity.y -= 15 * delta;
    particle.life -= particle.decay * delta;
    particle.mesh.scale.multiplyScalar(0.95);
    particle.mesh.material.opacity = particle.life;
    
    if (particle.life <= 0) {
      scene.remove(particle.mesh);
      particles.splice(index, 1);
    }
  });
}

// ==================== ОБНОВЛЕНИЕ ПИКАПОВ ====================
function updatePickups(delta) {
  pickups.forEach((pickup, index) => {
    pickup.time += delta;
    pickup.mesh.position.y = pickup.y + Math.sin(pickup.time * 3) * 0.2;
    pickup.mesh.rotation.y += delta * 2;
    
    const dist = player.mesh.position.distanceTo(pickup.mesh.position);
    if (dist < 1.5) {
      if (pickup.type === 'leaf') {
        energy = Math.min(100, energy + 20);
        updateEnergy();
        showNotification('+20 энергии');
      } else if (pickup.type === 'coin') {
        score += 50;
        updateScore();
        showNotification('+50 очков');
      } else if (pickup.type === 'heart') {
        hearts = Math.min(5, hearts + 1);
        updateHearts();
        showNotification('+1 сердце');
      }
      
      createParticles(pickup.mesh.position.x, pickup.mesh.position.y, pickup.mesh.position.z, 0x90EE90, 15, 3);
      scene.remove(pickup.mesh);
      pickups.splice(index, 1);
    }
  });
}

// ==================== АНИМАЦИИ TWEEN ====================
function updateTweens(delta) {
  tweenAnimations.forEach((tween, index) => {
    tween.duration -= delta;
    const t = 1 - (tween.duration / tween.originalDuration);
    
    if (tween.onUpdate) tween.onUpdate(t);
    
    if (tween.duration <= 0) {
      if (tween.onComplete) tween.onComplete();
      tweenAnimations.splice(index, 1);
    }
  });
}

// ==================== АТАКА ====================
function attack() {
  if (player.attackCooldown > 0 || gameState !== 'playing') return;
  
  if (currentWeapon === 0) {
    // Лоза - ближний бой
    player.attackCooldown = 0.5;
    animatePlayerAttack(player);
    
    const attackRange = 2.5;
    const attackX = player.mesh.position.x + player.facing * attackRange;
    
    enemies.forEach((enemy, index) => {
      if (enemy.animState === 'death') return;
      
      const dist = Math.abs(enemy.mesh.position.x - attackX);
      if (dist < 2) {
        enemy.health--;
        animateEnemyHit(enemy);
        
        if (enemy.health <= 0) {
          animateEnemyDeath(enemy);
          score += enemy.type === 'sweep' ? 100 : 150;
          updateScore();
          
          if (Math.random() < 0.6) {
            createPickup('leaf', enemy.mesh.position.x, enemy.mesh.position.y + 1);
          }
        }
      }
    });
    
    createParticles(attackX, player.mesh.position.y + 1, 0, 0x90EE90, 20, 5);
    
  } else if (currentWeapon === 1) {
    // Сеятель - дальний бой
    if (energy >= 4) {
      energy -= 4;
      updateEnergy();
      player.attackCooldown = 0.2;
      
      createBullet(
        player.mesh.position.x + player.facing * 0.8,
        player.mesh.position.y + 1,
        0,
        player.facing,
        'normal'
      );
      
      // Анимация выстрела
      player.rightArm.rotation.x = -1.5;
      setTimeout(() => {
        player.rightArm.rotation.x = 0;
      }, 100);
    } else {
      showNotification('Недостаточно энергии!');
    }
    
  } else if (currentWeapon === 2) {
    // Спора - взрыв
    if (energy >= 30) {
      energy -= 30;
      updateEnergy();
      player.attackCooldown = 1;
      
      createBullet(
        player.mesh.position.x + player.facing * 1,
        player.mesh.position.y + 1.5,
        0,
        player.facing,
        'bomb'
      );
      
      // Анимация броска
      player.rightArm.rotation.x = -2;
      setTimeout(() => {
        player.rightArm.rotation.x = 0;
      }, 300);
    } else {
      showNotification('Недостаточно энергии!');
    }
  }
}

// ==================== ВОЛНЫ ====================
function updateWaves(delta) {
  if (gameState !== 'playing') return;
  
  waveTimer += delta;
  spawnTimer += delta;
  
  // Спавн врагов
  if (spawnTimer > 2 && enemies.filter(e => e.animState !== 'death').length < 5) {
    spawnTimer = 0;
    const x = player.mesh.position.x + (Math.random() > 0.5 ? 25 : -25);
    const y = 5;
    
    const enemyType = Math.random() > 0.5 ? 'sweep' : 'trap';
    const enemy = createEnemy(enemyType, x, y);
    enemies.push(enemy);
    
    if (enemyType === 'sweep') unlockedEnemies.sweep = true;
    if (enemyType === 'trap') unlockedEnemies.trap = true;
  }
  
  // Следующая волна
  if (waveTimer > 30 && enemies.filter(e => e.animState !== 'death').length === 0) {
    currentWave++;
    waveTimer = 0;
    updateWaveInfo();
    
    if (currentWave > 10) {
      endGame(true);
    } else {
      energy = 100;
      updateEnergy();
      createPickup('heart', player.mesh.position.x + 3, player.mesh.position.y + 2);
      showNotification(`Волна ${currentWave} началась!`);
    }
  }
}

// ==================== UI ====================
function updateHearts() {
  const heartsDiv = document.getElementById('hearts');
  heartsDiv.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart' + (i >= hearts ? ' empty' : '');
    heart.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff4444" stroke="#ff6666" stroke-width="1"/></svg>';
    heartsDiv.appendChild(heart);
  }
}

function updateEnergy() {
  document.getElementById('energy-fill').style.width = energy + '%';
}

function updateScore() {
  document.getElementById('score').textContent = 'СЧЁТ: ' + score;
}

function updateWaveInfo() {
  document.getElementById('wave-info').textContent = 'ВОЛНА ' + currentWave + '/10';
}

function showNotification(text) {
  const notif = document.getElementById('notification');
  notif.textContent = text;
  notif.classList.add('show');
  setTimeout(() => {
    notif.classList.remove('show');
  }, 2000);
}

// ==================== ИГРОВОЙ ЦИКЛ ====================
function gameLoop(timestamp) {
  const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  
  if (gameState === 'playing') {
    updatePhysics(delta);
    updateEnemies(delta);
    updateBullets(delta);
    updateParticles(delta);
    updatePickups(delta);
    updateTweens(delta);
    updateWaves(delta);
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(gameLoop);
}

// ==================== УПРАВЛЕНИЕ ====================
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  
  if (e.code === 'KeyJ' && gameState === 'playing') {
    attack();
  }
  
  if (e.code === 'Digit1') setWeapon(0);
  if (e.code === 'Digit2') setWeapon(1);
  if (e.code === 'Digit3') setWeapon(2);
  
  if (e.code === 'Escape') {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0 && gameState === 'playing') {
    attack();
  }
});

// Выбор оружия
function setWeapon(weapon) {
  currentWeapon = weapon;
  document.querySelectorAll('.weapon').forEach((w, i) => {
    w.classList.toggle('active', i === weapon);
  });
}

document.querySelectorAll('.weapon').forEach((w, i) => {
  w.addEventListener('click', () => setWeapon(i));
});

// ==================== ИГРОВЫЕ ФУНКЦИИ ====================
function startGame() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('wave-info').style.display = 'block';
  document.getElementById('score').style.display = 'block';
  document.getElementById('weapons').style.display = 'flex';
  document.getElementById('minimap').style.display = 'block';
  
  gameState = 'playing';
  score = 0;
  hearts = 5;
  energy = 100;
  currentWave = 1;
  currentWeapon = 0;
  
  updateHearts();
  updateEnergy();
  updateScore();
  updateWaveInfo();
  setWeapon(0);
  
  // Очистка
  enemies.forEach(e => scene.remove(e.mesh));
  enemies = [];
  bullets.forEach(b => scene.remove(b.mesh));
  bullets = [];
  particles.forEach(p => scene.remove(p.mesh));
  particles = [];
  pickups.forEach(p => scene.remove(p.mesh));
  pickups = [];
  platforms.forEach(p => scene.remove(p.mesh));
  platforms = [];
  tweenAnimations = [];
  
  if (player) scene.remove(player.mesh);
  player = createPlayer();
  
  createPlatforms();
  
  lastTime = performance.now();
  showNotification('Игра началась!');
}

function pauseGame() {
  gameState = 'paused';
  document.getElementById('pause').style.display = 'flex';
}

function resumeGame() {
  gameState = 'playing';
  document.getElementById('pause').style.display = 'none';
  lastTime = performance.now();
}

function restartGame() {
  document.getElementById('pause').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  startGame();
}

function toMenu() {
  gameState = 'menu';
  document.getElementById('pause').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('wave-info').style.display = 'none';
  document.getElementById('score').style.display = 'none';
  document.getElementById('weapons').style.display = 'none';
  document.getElementById('minimap').style.display = 'none';
}

function endGame(won) {
  gameState = 'gameover';
  document.getElementById('end-title').textContent = won ? 'ПОБЕДА!' : 'ИГРА ОКОНЧЕНА';
  document.getElementById('final-score').textContent = score;
  document.getElementById('game-over').style.display = 'flex';
}

function showSettings() {
  document.getElementById('settings').style.display = 'flex';
}

function hideSettings() {
  document.getElementById('settings').style.display = 'none';
}

function showCollection() {
  const items = document.getElementById('collection-items');
  items.innerHTML = `
    <div style="color: white; margin: 15px 0; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px;">
      <h3 style="color: #8BC34A; margin-bottom: 8px;">🤖 Уборщик</h3>
      <p style="color: ${unlockedEnemies.sweep ? '#90EE90' : '#888'};">${unlockedEnemies.sweep ? '✓ Разблокирован' : '✗ Заблокирован - победи врага'}</p>
    </div>
    <div style="color: white; margin: 15px 0; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px;">
      <h3 style="color: #8BC34A; margin-bottom: 8px;">🌺 Хищный цветок</h3>
      <p style="color: ${unlockedEnemies.trap ? '#90EE90' : '#888'};">${unlockedEnemies.trap ? '✓ Разблокирован' : '✗ Заблокирован - победи врага'}</p>
    </div>
  `;
  document.getElementById('collection').style.display = 'flex';
}

function hideCollection() {
  document.getElementById('collection').style.display = 'none';
}

function exitGame() {
  if (confirm('Выйти из игры?')) {
    window.close();
  }
}

// Настройки
document.getElementById('volume').addEventListener('input', (e) => {
  // Регулировка громкости
});

document.getElementById('music').addEventListener('change', (e) => {
  // Вкл/выкл музыки
});

document.getElementById('shadows').addEventListener('change', (e) => {
  renderer.shadowMap.enabled = e.target.checked;
  scene.traverse(obj => {
    if (obj.material) obj.material.needsUpdate = true;
  });
});

document.getElementById('quality').addEventListener('change', (e) => {
  const quality = e.target.value;
  if (quality === 'high') {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
  } else if (quality === 'medium') {
    renderer.setPixelRatio(1.5);
    renderer.shadowMap.enabled = true;
  } else {
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = false;
  }
});

// Ресайз
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Запуск
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
