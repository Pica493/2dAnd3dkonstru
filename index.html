<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Тамагочи Reborn 3.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none}
body{display:flex;align-items:center;justify-content:center;background:#0a0a15}

#app{position:relative;width:100%;max-width:400px;height:100%;max-height:800px;overflow:hidden;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ===== MAIN MENU ===== */
#mainMenu{background:linear-gradient(160deg,#667eea 0%,#764ba2 55%,#f093fb 100%);align-items:center;justify-content:center;padding:24px}
#mainMenu h1{color:#fff;font-size:44px;text-align:center;margin:10px 0 4px;text-shadow:0 4px 20px rgba(0,0,0,.3);letter-spacing:-1.5px;font-weight:800}
#mainMenu .subtitle{color:rgba(255,255,255,.85);font-size:13px;margin-bottom:36px;letter-spacing:3px;text-transform:uppercase;font-weight:600}
#menuLogo{width:150px;height:150px;animation:bounce 2.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.menu-btn{width:100%;max-width:270px;padding:16px 22px;margin-bottom:12px;background:rgba(255,255,255,.97);border:none;border-radius:16px;color:#4c1d95;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:transform .1s,box-shadow .2s}
.menu-btn:active{transform:scale(.96);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.menu-btn.primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;box-shadow:0 6px 20px rgba(245,158,11,.4)}
.menu-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.menu-btn svg{width:22px;height:22px;flex-shrink:0}

/* ===== DARK SCREENS ===== */
.dark-screen{background:linear-gradient(160deg,#1a1a2e,#2d2b55);padding:16px}
.screen-header{display:flex;align-items:center;padding:8px 4px 16px;color:#fff;flex-shrink:0}
.back-btn{background:rgba(255,255,255,.15);border:none;width:42px;height:42px;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:12px;transition:background .15s,transform .1s}
.back-btn:active{background:rgba(255,255,255,.3);transform:scale(.94)}
.back-btn svg{width:22px;height:22px}
.screen-header h2{font-size:20px;font-weight:700}
.screen-body{flex:1;overflow-y:auto;padding:4px}

/* ===== SAVE SLOTS ===== */
.slot-card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:14px;transition:transform .15s,border-color .2s,background .2s;width:100%;text-align:left}
.slot-card:hover,.slot-card:active{border-color:#fbbf24;background:rgba(255,255,255,.13);transform:translateY(-2px)}
.slot-card.empty{opacity:.6;justify-content:center;padding:24px}
.slot-preview{width:60px;height:60px;flex-shrink:0;background:rgba(255,255,255,.1);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slot-info{flex:1;min-width:0}
.slot-info .name{font-weight:700;font-size:15px;margin-bottom:2px}
.slot-info .meta{font-size:11px;opacity:.7}
.slot-delete{background:rgba(239,68,68,.2);border:none;width:34px;height:34px;border-radius:10px;color:#fca5a5;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s}
.slot-delete:active{background:rgba(239,68,68,.4)}
.slot-delete svg{width:18px;height:18px}

/* ===== EGG SELECT ===== */
#eggSelect{background:linear-gradient(160deg,#1a1a3e,#2d2b55);padding:20px}
#eggSelect h2{color:#fff;text-align:center;font-size:22px;margin-bottom:4px}
#eggSelect .sub{color:rgba(255,255,255,.7);text-align:center;font-size:12px;margin-bottom:16px}
.egg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-content:center;padding:4px}
.egg-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.13);border-radius:18px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .15s,border-color .25s,background .25s;font-family:inherit;color:#fff}
.egg-card:hover,.egg-card:active{transform:translateY(-4px);border-color:var(--egg-color);background:rgba(255,255,255,.14)}
.egg-card svg{width:70px;height:90px}
.egg-name{font-weight:700;font-size:14px}
.egg-desc{font-size:10px;color:rgba(255,255,255,.65);text-align:center;line-height:1.35;min-height:26px}
.egg-trait{font-size:10px;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:8px;margin-top:2px;display:flex;align-items:center;gap:4px}
.egg-trait svg{width:12px;height:12px}

/* ===== GAME SCREEN ===== */
#gameScreen{background:#87ceeb}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,#87ceeb,#b0e0e6,#e0f7ff);transition:background 3s ease;z-index:0}
#stars{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity 2s;pointer-events:none}
#stars.on{opacity:1}
.star-dot{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2.5s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
#celestial{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff8b0,#ffd700);box-shadow:0 0 40px #ffd700;transition:all 2s ease;z-index:1}
#celestial.moon{background:radial-gradient(circle at 60% 40%,#f0f0ff,#c8c8e8);box-shadow:0 0 30px #c8c8e8}
#ground{position:absolute;bottom:0;left:0;right:0;height:38%;background:linear-gradient(180deg,#b8edb0,#6ec96e 60%,#56b056);border-radius:50% 50% 0 0/24px 24px 0 0;z-index:1;box-shadow:inset 0 10px 20px rgba(0,0,0,.05)}

#topbar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 10px;gap:6px}
.pill{background:rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.4);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);font-weight:600;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;transition:background .15s}
.pill:active{background:rgba(255,255,255,.5)}
.pill svg{width:16px;height:16px}
#speciesPill{font-size:11px;cursor:default}
#menuBtn{padding:6px 8px}
</style>

  <style>
#petArea{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#petContainer{position:relative;width:62%;aspect-ratio:1;max-width:240px;cursor:pointer;transition:transform .2s}
#petContainer:active{transform:scale(.96)}
.pet-svg{width:100%;height:100%;overflow:visible}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
.pet-body{animation:breathe 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.eyes-closed{display:none}
.mouth-sad,.mouth-neutral{display:none}
#petContainer.sleeping .eyes-open{display:none}
#petContainer.sleeping .eyes-closed{display:inline}
#petContainer.sleeping .mouth-happy,
#petContainer.sleeping .mouth-sad,
#petContainer.sleeping .mouth-neutral{display:none}
#petContainer.sleeping .pet-body{animation-duration:5s}
#petContainer.sad .mouth-happy{display:none}
#petContainer.sad .mouth-sad{display:inline}
#petContainer.neutral .mouth-happy{display:none}
#petContainer.neutral .mouth-neutral{display:inline}
#zzz{position:absolute;top:0;right:5%;opacity:0;pointer-events:none;transition:opacity .4s}
#zzz svg{width:34px;height:34px}
#petContainer.sleeping #zzz{opacity:1;animation:zzzFloat 2.4s ease-in-out infinite}
@keyframes zzzFloat{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(22px,-45px) scale(1.2);opacity:0}}
#thoughtBubble{position:absolute;top:-10px;left:50%;transform:translate(-50%,-10px);background:#fff;color:#333;border-radius:18px;padding:8px 14px;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:20;max-width:260px;text-align:center}
#thoughtBubble.show{opacity:1;transform:translate(-50%,0)}
#thoughtBubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}

#stats{position:relative;z-index:10;padding:0 10px 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stat{background:rgba(255,255,255,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.stat svg{width:16px;height:16px}
.stat .bar{width:100%;height:5px;background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
.stat .fill{height:100%;border-radius:3px;background:#4ade80;transition:width .6s ease,background .6s}

#actions{position:relative;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 10px 16px}
.action-btn{background:rgba(255,255,255,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.55);border-radius:14px;padding:8px 2px;cursor:pointer;transition:transform .1s,background .2s;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.action-btn:active{transform:scale(.9);background:rgba(255,255,255,.75)}
.action-btn svg{width:24px;height:24px}
.action-btn .label{font-size:8px;color:#333;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.action-btn.liked{box-shadow:0 0 0 2px #fbbf24,0 0 10px rgba(251,191,36,.5)}

.particle{position:fixed;pointer-events:none;z-index:30;animation:floatUp 1.4s ease-out forwards}
.particle svg{width:24px;height:24px;display:block}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}

/* ===== OVERLAY ===== */
#overlay{position:absolute;inset:0;z-index:100;display:none;background:rgba(15,15,30,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#overlay.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:popIn .3s cubic-bezier(.34,1.56,.64,1);max-height:90%;overflow-y:auto}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{font-size:20px;margin-bottom:14px;text-align:center;color:#333;display:flex;align-items:center;justify-content:center;gap:8px}
.panel h2 svg{width:24px;height:24px}
.btn{width:100%;padding:12px;border:none;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s;box-shadow:0 4px 12px rgba(102,126,234,.4);margin-bottom:8px}
.btn:active{transform:scale(.96)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 12px rgba(239,68,68,.4)}
.btn.secondary{background:#e5e7eb;color:#374151;box-shadow:none}

/* ===== SHOP ===== */
.shop-items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;max-height:50vh;overflow-y:auto}
.shop-item{background:#f5f7fb;border:2px solid #e0e6f0;border-radius:14px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s,border-color .2s,background .2s;font-family:inherit}
.shop-item:active{transform:scale(.94)}
.shop-item:hover{border-color:#a8c0ff;background:#eef3ff}
.shop-item svg{width:32px;height:32px}
.si-name{font-size:11px;font-weight:700;color:#444}
.si-price{font-size:11px;color:#888;display:flex;align-items:center;gap:3px}
.si-price svg{width:12px;height:12px}

/* ===== MINIGAME ===== */
.minigame{width:100%;max-width:360px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mg-header{display:flex;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:700;font-size:13px;align-items:center}
.mg-header .hdr{display:flex;align-items:center;gap:4px}
.mg-header svg{width:16px;height:16px}
.mg-field{position:relative;height:360px;background:linear-gradient(180deg,#1a1a3e,#2d2b55);overflow:hidden;cursor:pointer}
.mg-field::before{content:'';position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 90%,#fff,transparent);opacity:.6}
.mg-star{position:absolute;width:36px;height:36px;cursor:pointer;filter:drop-shadow(0 0 8px rgba(255,215,0,.8));transition:transform .1s}
.mg-star.caught{animation:starCatch .3s ease-out forwards;pointer-events:none}
@keyframes starCatch{to{transform:scale(2);opacity:0}}

/* ===== SETTINGS ===== */
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.1);color:#fff}
.setting-row:last-child{border-bottom:none}
.setting-row .label{font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.setting-row .label svg{width:20px;height:20px}
.switch{position:relative;width:46px;height:26px;background:rgba(255,255,255,.2);border-radius:13px;cursor:pointer;transition:background .2s}
.switch.on{background:#4ade80}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.switch.on::after{transform:translateX(20px)}
.slider{width:120px;accent-color:#fbbf24}

/* ===== ACHIEVEMENTS / DIARY ===== */
.ach-item{display:flex;gap:12px;padding:12px;background:rgba(255,255,255,.06);border-radius:14px;margin-bottom:8px;align-items:center;border:1px solid rgba(255,255,255,.1)}
.ach-item.locked{opacity:.4}
.ach-icon{width:44px;height:44px;flex-shrink:0;background:rgba(251,191,36,.15);border-radius:12px;display:flex;align-items:center;justify-content:center}
.ach-icon svg{width:26px;height:26px}
.ach-item.locked .ach-icon{background:rgba(255,255,255,.08)}
.ach-info{flex:1}
.ach-name{color:#fff;font-weight:700;font-size:14px;margin-bottom:2px}
.ach-desc{color:rgba(255,255,255,.65);font-size:11px}
.ach-check{width:22px;height:22px;flex-shrink:0;color:#4ade80}
.diary-item{display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:6px;color:#fff;align-items:center}
.diary-icon{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.diary-icon svg{width:20px;height:20px}
.diary-text{flex:1;font-size:12px;line-height:1.4}
.diary-time{font-size:10px;opacity:.5;white-space:nowrap}

/* ===== PAUSE MENU ===== */
#pauseMenu{background:linear-gradient(160deg,#2d2b55,#1a1a2e);color:#fff}
#pauseMenu h2{color:#fff}
.pause-btn{width:100%;padding:14px;margin-bottom:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:14px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:12px;transition:background .15s}
.pause-btn:active{background:rgba(255,255,255,.22)}
.pause-btn svg{width:22px;height:22px}
.pause-btn.danger{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.4);color:#fca5a5}
</style>
</head>

  <body>
<div id="app">

  <!-- MAIN MENU -->
  <div class="screen active" id="mainMenu">
    <div id="menuLogo"></div>
    <h1>Тамагочи</h1>
    <p class="subtitle">Reborn · 3.0</p>
    <button class="menu-btn primary" id="btnNewGame"><span id="icoNew"></span>Новая игра</button>
    <button class="menu-btn" id="btnContinue" disabled><span id="icoCont"></span>Продолжить</button>
    <button class="menu-btn" id="btnSettingsMenu"><span id="icoSet"></span>Настройки</button>
  </div>

  <!-- SAVE SLOTS -->
  <div class="screen dark-screen" id="saveSlots">
    <div class="screen-header">
      <button class="back-btn" data-back="mainMenu"><span id="icoBack1"></span></button>
      <h2>Сохранения</h2>
    </div>
    <div class="screen-body" id="slotsBody"></div>
  </div>

  <!-- EGG SELECT -->
  <div class="screen" id="eggSelect">
    <div class="screen-header">
      <button class="back-btn" data-back="mainMenu"><span id="icoBack2"></span></button>
      <h2>Выбери яйцо</h2>
    </div>
    <p class="sub" style="padding:0 20px">Из него вылупится твой питомец</p>
    <div class="egg-grid" id="eggGrid"></div>
  </div>

  <!-- GAME -->
  <div class="screen" id="gameScreen">
    <div id="sky"></div>
    <div id="stars"></div>
    <div id="celestial"></div>
    <div id="ground"></div>

    <div id="topbar">
      <div class="pill" id="clockPill"><span id="icoClock"></span><span id="clock">08:00</span></div>
      <div class="pill" id="speciesPill">Яйцо</div>
      <div class="pill"><span id="icoCoin1"></span><span id="coinVal">30</span></div>
      <div class="pill" id="menuBtn"><span id="icoMenu"></span></div>
    </div>

    <div id="petArea">
      <div id="petContainer">
        <div id="thoughtBubble"></div>
        <div id="zzz"></div>
      </div>
    </div>

    <div id="stats">
      <div class="stat" data-stat="hunger"><span class="sico"></span><div class="bar"><div class="fill"></div></div></div>
      <div class="stat" data-stat="energy"><span class="sico"></span><div class="bar"><div class="fill"></div></div></div>
      <div class="stat" data-stat="hygiene"><span class="sico"></span><div class="bar"><div class="fill"></div></div></div>
      <div class="stat" data-stat="happiness"><span class="sico"></span><div class="bar"><div class="fill"></div></div></div>
      <div class="stat" data-stat="health"><span class="sico"></span><div class="bar"><div class="fill"></div></div></div>
    </div>

    <div id="actions">
      <button class="action-btn" data-action="feed"><span class="aico"></span><span class="label">Корм</span></button>
      <button class="action-btn" data-action="sleep"><span class="aico" id="sleepIco"></span><span class="label">Спать</span></button>
      <button class="action-btn" data-action="wash"><span class="aico"></span><span class="label">Мыть</span></button>
      <button class="action-btn" data-action="play"><span class="aico"></span><span class="label">Играть</span></button>
      <button class="action-btn" data-action="shop"><span class="aico"></span><span class="label">Магаз.</span></button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="screen dark-screen" id="settingsScreen">
    <div class="screen-header">
      <button class="back-btn" id="settingsBack"><span id="icoBack3"></span></button>
      <h2>Настройки</h2>
    </div>
    <div class="screen-body" style="padding:8px 16px">
      <div class="setting-row">
        <div class="label"><span id="icoSound"></span>Звуки</div>
        <div class="switch on" id="swSound"></div>
      </div>
      <div class="setting-row">
        <div class="label"><span id="icoMusic"></span>Музыка</div>
        <div class="switch on" id="swMusic"></div>
      </div>
      <div class="setting-row">
        <div class="label"><span id="icoVol"></span>Громкость</div>
        <input type="range" class="slider" id="volSlider" min="0" max="100" value="70">
      </div>
      <div class="setting-row" style="border:none;margin-top:20px">
        <button class="btn danger" id="resetAll">Сбросить все сохранения</button>
      </div>
    </div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div class="screen dark-screen" id="achievementsScreen">
    <div class="screen-header">
      <button class="back-btn" id="achBack"><span id="icoBack4"></span></button>
      <h2>Достижения</h2>
    </div>
    <div class="screen-body" id="achBody" style="padding:0 12px"></div>
  </div>

  <!-- DIARY -->
  <div class="screen dark-screen" id="diaryScreen">
    <div class="screen-header">
      <button class="back-btn" id="diaryBack"><span id="icoBack5"></span></button>
      <h2>Дневник</h2>
    </div>
    <div class="screen-body" id="diaryBody" style="padding:0 12px"></div>
  </div>

  <!-- OVERLAY (внутри #app для правильного клиппинга) -->
  <div id="overlay"></div>

</div>

<script>

let audioCtx = null, melodyIdx = 0;
let settings = { sound: true, music: true, volume: 0.7 };

const SETTINGS_KEY = 'tamagotchi_settings_v3';
const SLOT_KEY = i => 'tamagotchi_slot_' + i;

function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem(SETTINGS_KEY)); if (s) Object.assign(settings, s); } catch(e) {}
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) {} }

function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; } }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, dur, type = 'sine', vol = 0.08, delay = 0) {
  if (!audioCtx || !settings.sound) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol * settings.volume, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}

const SFX = {
  click: () => tone(600, 0.08, 'sine', 0.06),
  feed: () => { tone(220, 0.12, 'sine', 0.09); tone(180, 0.12, 'sine', 0.09, 0.15); tone(160, 0.18, 'sine', 0.09, 0.3); },

let state = null;
let currentSlot = null;
let loopRunning = false;
let lastFrame = performance.now();
let uiAcc = 0, thoughtAcc = 0;
let thoughtTimer = null;
let actionLock = false;

const $ = id => document.getElementById(id);
const petContainer = $('petContainer');
const thoughtBubble = $('thoughtBubble');
const overlay = $('overlay');

function defaultState(species) {
  return {
    species, branch: null,
    hunger: 75, energy: 75, hygiene: 80, happiness: 75, health: 100,
    coins: 30, ageSec: 0, stage: 0, sleeping: false,
    time: 8 * 60, lastTick: Date.now(), createdAt: Date.now(),
    stats: { feeds: 0, washes: 0, sleeps: 0, pets: 0, gamesPlayed: 0, totalStars: 0, purchases: 0 },
    achievements: {},
    diary: []
  };
}

function saveGame() {
  if (!state || currentSlot === null) return;
  state.lastTick = Date.now();
  try { localStorage.setItem(SLOT_KEY(currentSlot), JSON.stringify({ state, savedAt: Date.now() })); } catch(e) {}
}

function loadGame(slot) {
  try {
    const raw = localStorage.getItem(SLOT_KEY(slot));
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data.state || !SPECIES[data.state.species]) return null;
    return data;
  } catch(e) { return null; }
}

function deleteGame(slot) { try { localStorage.removeItem(SLOT_KEY(slot)); } catch(e) {} }
function getAllSlots() { return [0,1,2].map(i => ({ slot: i, data: loadGame(i) })); }
function findEmptySlot() { for (let i = 0; i < 3; i++) if (!loadGame(i)) return i; return -1; }

function applyOfflineDecay() {
  const elapsed = (Date.now() - (state.lastTick || Date.now())) / 1000;
  if (elapsed > 5 && elapsed < 7200) {
    const t = Math.min(elapsed, 3600);
    state.hunger = Math.max(0, state.hunger - t * 0.15);
    state.hygiene = Math.max(0, state.hygiene - t * 0.1);
    state.happiness = Math.max(0, state.happiness - t * 0.12);
    if (!state.sleeping) state.energy = Math.max(0, state.energy - t * 0.1);
    state.ageSec += t;
  }
  state.lastTick = Date.now();
  state.stage = stageForAge(state.ageSec);
}

function stageForAge(sec) {
  if (sec < 60) return 0;
  if (sec < 180) return 1;
  return 2;
}
const STAGE_LABELS = ['Малыш', 'Подросток', 'Взрослый'];

function determineBranch() {
  const s = state.stats;
  const totalActions = s.feeds + s.washes + s.pets + s.gamesPlayed;
  const avg = (state.hunger + state.energy + state.hygiene + state.happiness + state.health) / 5;
  return (totalActions >= 25 && avg >= 55) ? 'good' : 'bad';
}

function addDiary(iconKey, text) {
  if (!state) return;
  state.diary.unshift({ icon: iconKey, text, time: Date.now() });
  if (state.diary.length > 50) state.diary = state.diary.slice(0, 50);
}

function checkAchievements() {
  if (!state) return;
  let newAch = false;
  ACHIEVEMENTS.forEach(ach => {
    if (state.achievements[ach.id]) return;
    if (ach.check(state)) {
      state.achievements[ach.id] = Date.now();
      addDiary('trophy', `Достижение: ${ach.name}`);
      newAch = true;
      setTimeout(() => { if (state) showBubble(`Достижение! ${ach.name}`); }, 500);
    }
  });
  if (newAch) { playSound('ach'); spawnParticles('trophy', 3); }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = $(id);
  if (el) el.classList.add('active');
  if (id === 'saveSlots') renderSlots();
  else if (id === 'achievementsScreen') renderAchievements();
  else if (id === 'diaryScreen') renderDiary();
  else if (id === 'mainMenu') refreshContinueBtn();
  if (id !== 'gameScreen') stopGameLoop();
  if (id === 'gameScreen' && state) startGameLoop();
}

function closeOverlay() { overlay.classList.remove('show'); overlay.innerHTML = ''; }

function showBubble(text, ms = 2500) {
  thoughtBubble.textContent = text;
  thoughtBubble.classList.add('show');
  clearTimeout(thoughtTimer);
  thoughtTimer = setTimeout(() => thoughtBubble.classList.remove('show'), ms);
}

function spawnParticles(iconKey, count = 4) {
  const rect = petContainer.getBoundingClientRect();
  if (rect.width === 0) return;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.innerHTML = ICONS[iconKey] || ICONS.sparkle;
    el.style.left = (rect.left + rect.width * (0.2 + Math.random() * 0.6)) + 'px';
    el.style.top = (rect.top + rect.height * (0.2 + Math.random() * 0.5)) + 'px';
    el.style.animationDelay = (i * 0.08) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}

function refreshPetBody() {
  if (!state) return;
  petContainer.querySelectorAll('.pet-svg').forEach(el => el.remove());
  petContainer.insertAdjacentHTML('afterbegin', renderPet(state.species, state.stage, state.branch));
  const sp = SPECIES[state.species];
  let label = sp.name;
  if (state.stage === 2 && state.branch) label = state.branch === 'good' ? sp.adultGood.name : sp.adultBad.name;
  $('speciesPill').textContent = label;
  document.querySelectorAll('.action-btn').forEach(btn => {
    btn.classList.toggle('liked', btn.dataset.action === sp.like);
  });
  $('sleepIco').innerHTML = state.sleeping ? ICONS.wake : ICONS.sleep;
}

function initStars() {
  const stars = $('stars');
  stars.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star-dot';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(s);
  }
}

function updateSky() {
  if (!state) return;
  const h = (state.time % 1440) / 60;
  let bg, isNight = false;
  if (h < 5) { bg = 'linear-gradient(180deg,#0f0c29,#302b63,#24243e)'; isNight = true; }
  else if (h < 7) bg = 'linear-gradient(180deg,#ff9a9e,#fecfef,#a8d8ea)';
  else if (h < 17) bg = 'linear-gradient(180deg,#87ceeb,#b0e0e6,#e0f7ff)';
  else if (h < 19) bg = 'linear-gradient(180deg,#ff9a9e,#fad0c4,#ffd1ff)';
  else { bg = 'linear-gradient(180deg,#1a1a2e,#16213e,#0f3460)'; isNight = true; }
  $('sky').style.background = bg;
  $('stars').classList.toggle('on', isNight);
  let progress;
  if (h >= 6 && h < 18) progress = (h - 6) / 12;
  else { const hh = h >= 18 ? h - 18 : h + 6; progress = hh / 12; }
  const x = 8 + progress * 84;
  const y = 55 - Math.sin(progress * Math.PI) * 42;
  const cel = $('celestial');
  cel.style.left = `calc(${x}% - 28px)`;
  cel.style.top = `calc(${y}% - 28px)`;
  cel.classList.toggle('moon', isNight);
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  $('clock').textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}

function barColor(v) { return v > 60 ? '#4ade80' : v > 30 ? '#fbbf24' : '#ef4444'; }

function updateStatsUI() {
  if (!state) return;
  ['hunger','energy','hygiene','happiness','health'].forEach(k => {
    const el = document.querySelector(`.stat[data-stat="${k}"] .fill`);
    if (!el) return;
    const v = Math.max(0, Math.min(100, state[k]));
    el.style.width = v + '%';
    el.style.background = barColor(v);
  });
  $('coinVal').textContent = state.coins;
}

function updateMood() {
  if (!state) return;
  petContainer.classList.toggle('sleeping', state.sleeping);
  const avg = (state.hunger + state.happiness + state.health) / 3;
  let cls = '';
  if (avg < 35 || state.health < 40) cls = 'sad';
  else if (avg < 60) cls = 'neutral';
  petContainer.classList.remove('sad','neutral');
  if (cls) petContainer.classList.add(cls);
}

function think(force) {
  if (!state) return;
  if (state.sleeping) { showBubble('Zzz...'); return; }
  const th = THOUGHTS[state.species];
  const msgs = [];
  if (state.hunger < 30) msgs.push(...th.hungry);
  if (state.energy < 30) msgs.push(...th.tired);
  if (state.hygiene < 30) msgs.push(...th.dirty);
  if (state.happiness < 30) msgs.push(...th.bored);
  if (state.health < 40) msgs.push(...th.sick);
  if (msgs.length === 0) msgs.push(...th.happy);
  if (force || Math.random() < 0.5) showBubble(msgs[Math.floor(Math.random() * msgs.length)]);
}

// ============ ДЕЙСТВИЯ ============
function feed() {
  if (!state) return;
  if (state.sleeping) { showBubble('Тсс... я сплю'); playSound('sleep'); return; }
  if (state.hunger >= 99) { showBubble('Я сыт!'); playSound('click'); return; }
  if (actionLock) return; actionLock = true; setTimeout(() => actionLock = false, 800);
  const isLiked = SPECIES[state.species].like === 'feed';
  state.hunger = Math.min(100, state.hunger + (isLiked ? 37.5 : 25));
  state.happiness = Math.min(100, state.happiness + 4);
  state.stats.feeds++;
  playSound(isLiked ? 'happy' : 'feed');
  spawnParticles('apple', 4);
  showBubble(isLiked ? 'Обожаю покушать!' : 'Ням-ням!');
  saveGame(); updateStatsUI(); updateMood(); checkAchievements();
}

function toggleSleep() {
  if (!state) return;
  state.sleeping = !state.sleeping;
  if (state.sleeping) state.stats.sleeps++;
  const isLiked = SPECIES[state.species].like === 'sleep';
  playSound(state.sleeping ? 'sleep' : 'click');
  showBubble(state.sleeping ? (isLiked ? 'Наконец-то посплю!' : 'Сладких снов...') : 'Проснулся!');
  refreshPetBody();
  saveGame(); updateMood();
}

function wash() {
  if (!state) return;
  if (state.sleeping) { showBubble('Тсс... я сплю'); playSound('sleep'); return; }
  if (actionLock) return; actionLock = true; setTimeout(() => actionLock = false, 800);
  const isLiked = SPECIES[state.species].like === 'wash';
  state.hygiene = Math.min(100, state.hygiene + (isLiked ? 60 : 40));
  state.energy = Math.max(0, state.energy - 3);
  state.stats.washes++;
  playSound(isLiked ? 'happy' : 'wash');
  spawnParticles('wash', 6);
  showBubble(isLiked ? 'Как же хорошо!' : 'Как свежо!');
  saveGame(); updateStatsUI(); updateMood(); checkAchievements();
}

function petThePet() {
  if (!state) return;
  if (state.sleeping) { showBubble('Zzz...'); return; }
  state.happiness = Math.min(100, state.happiness + 4);
  state.stats.pets++;
  playSound('click');
  spawnParticles('heart', 3);
  if (Math.random() < 0.4) showBubble('Муррр');
  saveGame(); updateStatsUI(); updateMood(); checkAchievements();
}

function startMinigame() {
  if (!state) return;
  if (state.sleeping) { showBubble('Тсс... я сплю'); return; }
  if (state.energy < 15) { playSound('sad'); showBubble('Я слишком устал'); return; }
  playSound('click');
  overlay.innerHTML = `<div class="minigame">
    <div class="mg-header">
      <span class="hdr">${ICONS.sparkle}Лови звёзды</span>
      <span class="hdr">${ICONS.sparkle}<b id="mgScore">0</b></span>
      <span class="hdr">${ICONS.clock}<b id="mgTime">20</b></span>
    </div>
    <div class="mg-field" id="mgField"></div>
  </div>`;
  overlay.classList.add('show');
  const field = $('mgField');
  let score = 0, timeLeft = 20, running = true;
  const stars = [];
  let lastT = performance.now();

  function spawn() {
    if (!running) return;
    const el = document.createElement('div');
    el.className = 'mg-star';
    el.innerHTML = ICONS.sparkle;
    const fw = field.clientWidth || 300;
    el.style.left = (10 + Math.random() * (fw - 46)) + 'px';
    el.style.top = '-40px';
    field.appendChild(el);
    stars.push({ el, y: -40, vy: 70 + Math.random() * 90, caught: false });
  }

  const spawnInt = setInterval(spawn, 450);
  const timerInt = setInterval(() => {
    timeLeft--;
    const t = $('mgTime'); if (t) t.textContent = timeLeft;
    if (timeLeft <= 0) end();
  }, 1000);

  function mgLoop(now) {
    if (!running) return;
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      if (s.caught) continue;
      s.y += s.vy * dt;
      s.el.style.top = s.y + 'px';
      if (s.y > field.clientHeight) { s.el.remove(); stars.splice(i, 1); }
    }
    requestAnimationFrame(mgLoop);
  }
  requestAnimationFrame(mgLoop);

  field.addEventListener('click', e => {
    const tgt = e.target.closest('.mg-star');
    if (!tgt) return;
    const s = stars.find(x => x.el === tgt);
    if (!s || s.caught) return;
    s.caught = true; score++;
    const sc = $('mgScore'); if (sc) sc.textContent = score;
    tgt.classList.add('caught');
    playSound('coin');
    setTimeout(() => tgt.remove(), 320);
  });

  function end() {
    running = false;
    clearInterval(spawnInt); clearInterval(timerInt);
    stars.forEach(s => s.el.remove());
    if (!state) { closeOverlay(); return; }
    const reward = score * 2;
    const isLiked = SPECIES[state.species].like === 'play';
    state.coins += reward;
    state.happiness = Math.min(100, state.happiness + score * (isLiked ? 3 : 2));
    state.energy = Math.max(0, state.energy - 10);
    state.stats.gamesPlayed++;
    state.stats.totalStars += score;
    playSound('levelup');
    addDiary('play', `Игра: поймано ${score} звёзд`);
    saveGame(); updateStatsUI(); updateMood(); checkAchievements();
    overlay.innerHTML = `<div class="panel" style="text-align:center">
      <h2>${isLiked ? 'Обожаю играть!' : 'Молодец!'}</h2>
      <p style="color:#555;margin:6px 0;font-size:15px">Звёзд: <b style="color:#667eea">${score}</b></p>
      <p style="color:#555;margin:6px 0;font-size:15px">Монет: <b style="color:#667eea">+${reward}</b></p>
      <button class="btn" id="mgClose" style="margin-top:10px">Отлично!</button>
    </div>`;
    $('mgClose').addEventListener('click', closeOverlay);
  }
}

function renderSlots() {
  const body = $('slotsBody');
  const slots = getAllSlots();
  // ВАЖНО: outer — <div> (не <button>), т.к. внутри есть кнопка удаления
  body.innerHTML = slots.map(({ slot, data }) => {
    if (!data) {
      return `<div class="slot-card empty" data-slot="${slot}" data-empty="1"><span style="font-size:14px;opacity:.7">Пустой слот ${slot+1}</span></div>`;
    }
    const st = data.state;
    const sp = SPECIES[st.species];
    const stageLabel = STAGE_LABELS[st.stage] || 'Малыш';
    const date = new Date(data.savedAt || st.lastTick);
    const dateStr = date.toLocaleDateString('ru') + ' ' + date.toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'});
    return `<div class="slot-card" data-slot="${slot}">
      <div class="slot-preview" data-preview="${slot}"></div>
      <div class="slot-info">
        <div class="name">${sp.name}</div>
        <div class="meta">${stageLabel} · ${dateStr}</div>
      </div>
      <button class="slot-delete" data-del="${slot}" title="Удалить">${ICONS.trash}</button>
    </div>`;
  }).join('');

  slots.forEach(({ slot, data }) => {
    if (!data) return;
    const prev = body.querySelector(`[data-preview="${slot}"]`);
    if (prev) {
      prev.innerHTML = renderPet(data.state.species, data.state.stage, data.state.branch);
      const svgEl = prev.querySelector('svg');
      if (svgEl) { svgEl.style.width = '100%'; svgEl.style.height = '100%'; }
    }
  });

  body.querySelectorAll('.slot-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.slot-delete')) return;
      initAudio(); playSound('click');
      const slot = +card.dataset.slot;
      const data = loadGame(slot);
      if (data) { enterGame(slot, data.state); }
      else { currentSlot = slot; renderEggGrid(); showScreen('eggSelect'); }
    });
  });

  body.querySelectorAll('.slot-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const slot = +btn.dataset.del;
      if (confirm('Удалить сохранение?')) {
        deleteGame(slot);
        playSound('sad');
        renderSlots();
        refreshContinueBtn();
      }
    });
  });
}

function startNewGame(speciesId) {
  if (currentSlot === null || currentSlot === undefined) currentSlot = findEmptySlot();
  if (currentSlot === -1) { alert('Все слоты заняты. Удали одно сохранение.'); showScreen('mainMenu'); return; }
  state = defaultState(speciesId);
  addDiary('sparkle', `Появился ${SPECIES[speciesId].name}!`);
  saveGame();
  enterGame(currentSlot, state);
}

function enterGame(slot, st) {
  currentSlot = slot;
  state = st;
  if (!state.stats) state.stats = { feeds:0, washes:0, sleeps:0, pets:0, gamesPlayed:0, totalStars:0, purchases:0 };
  if (!state.achievements) state.achievements = {};
  if (!state.diary) state.diary = [];
  if (state.branch === undefined) state.branch = null;
  if (state.lastTick) applyOfflineDecay();
  state.stage = stageForAge(state.ageSec);
  if (state.stage === 2 && !state.branch) state.branch = determineBranch();
  refreshPetBody();
  updateStatsUI();
  updateSky();
  updateMood();
  showScreen('gameScreen');
  setTimeout(() => {
    if (state) {
      if (state.stage === 0) showBubble(`Привет! Я ${SPECIES[state.species].name.toLowerCase()}`);
      else showBubble('Как я вырос!');
      checkAchievements();
    }
  }, 600);
  saveGame();
}

    const dateStr = d.toLocaleDateString('ru', {day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    return `<div class="diary-item">
      <div class="diary-icon">${ICONS[e.icon] || ICONS.sparkle}</div>
      <div class="diary-text">${e.text}</div>
      <div class="diary-time">${dateStr}</div>
    </div>`;
  }).join('');
}

// ============ НАСТРОЙКИ ============
function renderSettingsUI() {
  $('swSound').classList.toggle('on', settings.sound);
  $('swMusic').classList.toggle('on', settings.music);
  $('volSlider').value = Math.round(settings.volume * 100);
}

function setupSettingsHandlers() {
  $('swSound').addEventListener('click', () => {
    settings.sound = !settings.sound; saveSettings();
    $('swSound').classList.toggle('on', settings.sound);
    if (settings.sound) playSound('click');
  });
  $('swMusic').addEventListener('click', () => {
    settings.music = !settings.music; saveSettings();
    $('swMusic').classList.toggle('on', settings.music);
  });
  $('volSlider').addEventListener('input', e => {
    settings.volume = e.target.value / 100; saveSettings();
  });
  $('resetAll').addEventListener('click', () => {
    if (confirm('Удалить ВСЕ сохранения? Это нельзя отменить!')) {
      [0,1,2].forEach(deleteGame);
      state = null; currentSlot = null;
      showScreen('mainMenu');
    }
  });
  $('settingsBack').addEventListener('click', () => {
    playSound('click');
    const fromGame = $('settingsScreen').dataset.fromGame === '1';
    $('settingsScreen').dataset.fromGame = '';
    if (fromGame && state) showScreen('gameScreen');
    else showScreen('mainMenu');
  });
}

     // ============ ИГРОВОЙ ЦИКЛ ============
  function startGameLoop() {
    if (loopRunning) return;
    loopRunning = true;
    lastFrame = performance.now();
    requestAnimationFrame(gameLoop);
  }

  function stopGameLoop() { loopRunning = false; }

  function gameLoop(now) {
    if (!loopRunning) return;
    if (!state) { loopRunning = false; return; }
    const dt = Math.min((now - lastFrame) / 1000, 2);
    lastFrame = now;
    if (!overlay.classList.contains('show')) update(dt);
    requestAnimationFrame(gameLoop);
  }

  function update(dt) {
    if (!state) return;
    state.time = (state.time + dt * 2) % 1440;
    state.ageSec += dt;

    const newStage = stageForAge(state.ageSec);
    if (newStage !== state.stage) {
      state.stage = newStage;
      if (newStage === 2) {
        state.branch = determineBranch();
        const sp = SPECIES[state.species];
        const nm = state.branch === 'good' ? sp.adultGood.name : sp.adultBad.name;
        showBubble(`Я вырос! Теперь я ${nm}!`);
        addDiary('trophy', `Эволюция: ${nm}`);
      } else {
        showBubble(`Теперь я ${STAGE_LABELS[newStage].toLowerCase()}!`);
        addDiary('sparkle', `Эволюция: ${STAGE_LABELS[newStage]}`);
      }
      playSound('levelup');
      spawnParticles('sparkle', 8);
      refreshPetBody();
      checkAchievements();
    }

    if (state.sleeping) {
      state.energy = Math.min(100, state.energy + dt * 0.9);
      state.hunger = Math.max(0, state.hunger - dt * 0.06);
      state.hygiene = Math.max(0, state.hygiene - dt * 0.04);
      state.happiness = Math.max(0, state.happiness - dt * 0.04);
      if (state.energy >= 100) {
        state.sleeping = false;
        refreshPetBody();
        showBubble('Выспался!');
        playSound('happy');
      }
    } else {
      state.hunger = Math.max(0, state.hunger - dt * 0.15);
      state.energy = Math.max(0, state.energy - dt * 0.1);
      state.hygiene = Math.max(0, state.hygiene - dt * 0.1);
      state.happiness = Math.max(0, state.happiness - dt * 0.12);
    }

    const critical = (state.hunger < 20 ? 1 : 0) + (state.hygiene < 20 ? 1 : 0) + (state.happiness < 20 ? 1 : 0);
    if (critical >= 2) state.health = Math.max(0, state.health - dt * 0.35);
    else if (state.hunger > 50 && state.hygiene > 50) state.health = Math.min(100, state.health + dt * 0.08);

    uiAcc += dt;
    if (uiAcc >= 0.25) { uiAcc = 0; updateStatsUI(); updateSky(); updateMood(); }

    thoughtAcc += dt;
    if (thoughtAcc > 12) { thoughtAcc = 0; think(true); }

    // Автосохранение и проверка достижений по возрасту — раз в 10 сек
    const secNow = Math.floor(state.ageSec);
    if (secNow % 10 === 0 && secNow !== Math.floor(state.ageSec - dt)) {
      saveGame();
      checkAchievements();
    }
  }

  // ============ ИКОНКИ В HTML ============
  function populateIcons() {
    $('icoNew').innerHTML = ICONS.newgame;
    $('icoCont').innerHTML = ICONS.cont;
    $('icoSet').innerHTML = ICONS.settings;
    $('icoBack1').innerHTML = ICONS.back;
    $('icoBack2').innerHTML = ICONS.back;
    $('icoBack3').innerHTML = ICONS.back;
    $('icoBack4').innerHTML = ICONS.back;
    $('icoBack5').innerHTML = ICONS.back;
    $('icoClock').innerHTML = ICONS.clock;
    $('icoCoin1').innerHTML = ICONS.coin;
    $('icoMenu').innerHTML = ICONS.menu;
    $('icoSound').innerHTML = ICONS.sound;
    $('icoMusic').innerHTML = ICONS.music;
    $('icoVol').innerHTML = ICONS.volume;
    $('zzz').innerHTML = ICONS.zzz;
    document.querySelector('[data-stat="hunger"] .sico').innerHTML = ICONS.hunger;
    document.querySelector('[data-stat="energy"] .sico').innerHTML = ICONS.energy;
    document.querySelector('[data-stat="hygiene"] .sico').innerHTML = ICONS.hygiene;
    document.querySelector('[data-stat="happiness"] .sico').innerHTML = ICONS.happiness;
    document.querySelector('[data-stat="health"] .sico').innerHTML = ICONS.health;
    document.querySelector('[data-action="feed"] .aico').innerHTML = ICONS.feed;
    document.querySelector('[data-action="sleep"] .aico').innerHTML = ICONS.sleep;
    document.querySelector('[data-action="wash"] .aico').innerHTML = ICONS.wash;
    document.querySelector('[data-action="play"] .aico').innerHTML = ICONS.play;
    document.querySelector('[data-action="shop"] .aico').innerHTML = ICONS.shop;
    $('menuLogo').innerHTML = renderPet('cat', 2, 'good');
    const logoSvg = $('menuLogo').querySelector('svg');
    if (logoSvg) { logoSvg.style.width = '100%'; logoSvg.style.height = '100%'; }
  }

  function refreshContinueBtn() {
    const hasAny = getAllSlots().some(s => s.data);
    $('btnContinue').disabled = !hasAny;
  }

  // ============ ОБРАБОТЧИКИ ============
  function setupMainMenu() {
    $('btnNewGame').addEventListener('click', () => {
      initAudio(); playSound('click');
      const empty = findEmptySlot();
      if (empty === -1) { alert('Все слоты заняты. Удали одно сохранение (Продолжить).'); return; }
      currentSlot = empty;
      renderEggGrid();
      showScreen('eggSelect');
    });
    $('btnContinue').addEventListener('click', () => {
      initAudio(); playSound('click');
      showScreen('saveSlots');
    });
    $('btnSettingsMenu').addEventListener('click', () => {
      initAudio(); playSound('click');
      $('settingsScreen').dataset.fromGame = '';
      renderSettingsUI();
      showScreen('settingsScreen');
    });
    document.querySelectorAll('[data-back]').forEach(btn => {
      btn.addEventListener('click', () => { playSound('click'); showScreen(btn.dataset.back); });
    });
    $('achBack').addEventListener('click', () => {
      playSound('click');
      if (state) showScreen('gameScreen'); else showScreen('mainMenu');
    });
    $('diaryBack').addEventListener('click', () => {
      playSound('click');
      if (state) showScreen('gameScreen'); else showScreen('mainMenu');
    });
  }

  function setupActions() {
    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        initAudio();
        if (!state) return;
        const a = btn.dataset.action;
        if (a === 'feed') feed();
        else if (a === 'sleep') toggleSleep();
        else if (a === 'wash') wash();
        else if (a === 'play') startMinigame();
        else if (a === 'shop') openShop();
      });
    });
    petContainer.addEventListener('click', () => { initAudio(); if (state) petThePet(); });
    $('menuBtn').addEventListener('click', () => { if (state) openPauseMenu(); });
    document.addEventListener('touchstart', initAudio, { once: true });
    document.addEventListener('mousedown', initAudio, { once: true });
    window.addEventListener('beforeunload', () => { if (state) saveGame(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && state) saveGame(); });
  }

  // ============ ИНИЦИАЛИЗАЦИЯ ============
  function init() {
    loadSettings();
    populateIcons();
    initStars();
    setupMainMenu();
    setupActions();
    setupSettingsHandlers();
    refreshContinueBtn();
    renderSettingsUI();
    // ВАЖНО: startGameLoop НЕ вызываем здесь — цикл запустится при входе в игру
    setInterval(() => {
      if (state && $('gameScreen').classList.contains('active')) saveGame();
    }, 8000);
  }

  init();
})();
</script>
