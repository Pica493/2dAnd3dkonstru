<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Тамагочи Reborn 5.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;background:#0a0a15}
body{display:flex}
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:900px){#app{max-width:900px;margin:0 auto}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* MENU */
#mainMenu{background:linear-gradient(160deg,#667eea 0%,#764ba2 45%,#f093fb 100%);align-items:center;justify-content:center;padding:clamp(16px,4vh,40px)}
#mainMenu::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.15),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.1),transparent 40%);pointer-events:none}
#menuLogo{width:clamp(140px,22vh,200px);height:clamp(140px,22vh,200px);animation:bounce 2.5s ease-in-out infinite;z-index:1}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
#mainMenu h1{color:#fff;font-size:clamp(32px,6vh,52px);margin:8px 0 4px;text-shadow:0 4px 24px rgba(0,0,0,.35);letter-spacing:-1.5px;font-weight:800;z-index:1}
#mainMenu .subtitle{color:rgba(255,255,255,.9);font-size:clamp(11px,1.5vh,14px);margin-bottom:clamp(20px,4vh,40px);letter-spacing:3px;text-transform:uppercase;font-weight:600;z-index:1}
.menu-btn{width:100%;max-width:320px;padding:clamp(12px,2vh,18px) 22px;margin-bottom:clamp(8px,1.5vh,14px);background:rgba(255,255,255,.97);border:none;border-radius:16px;color:#4c1d95;font-size:clamp(14px,2vh,17px);font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .1s;z-index:1}
.menu-btn:active{transform:scale(.96)}
.menu-btn.primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.menu-btn:disabled{opacity:.4;cursor:not-allowed}
.menu-btn svg{width:22px;height:22px;flex-shrink:0}

/* DARK SCREENS */
.dark-screen{background:linear-gradient(160deg,#1a1a2e,#2d2b55);padding:clamp(10px,2vh,20px)}
.screen-header{display:flex;align-items:center;padding:8px 4px 16px;color:#fff;flex-shrink:0}
.back-btn{background:rgba(255,255,255,.15);border:none;width:44px;height:44px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:12px}
.back-btn svg{width:22px;height:22px}
.screen-header h2{font-size:clamp(18px,2.5vh,22px);font-weight:700}
.screen-body{flex:1;overflow-y:auto;padding:4px;scrollbar-width:thin}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tab.active{background:#fbbf24;color:#1a1a2e;border-color:#fbbf24}
.tab svg{width:18px;height:18px}

/* SLOTS */
.slot-card{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:14px;width:100%;text-align:left;transition:border-color .2s}
.slot-card:active{border-color:#fbbf24}
.slot-card.empty{opacity:.6;justify-content:center;padding:24px}
.slot-preview{width:64px;height:64px;flex-shrink:0;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden}
.slot-info{flex:1;min-width:0}
.slot-info .name{font-weight:700;font-size:15px;margin-bottom:2px}
.slot-info .meta{font-size:11px;opacity:.7}
.slot-delete{background:rgba(239,68,68,.2);border:none;width:34px;height:34px;border-radius:10px;color:#fca5a5;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.slot-delete svg{width:18px;height:18px}

/* EGGS */
#eggSelect{background:linear-gradient(160deg,#1a1a3e,#2d2b55);padding:clamp(10px,2vh,20px)}
.egg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;align-content:center;padding:4px;max-width:600px;margin:0 auto;width:100%}
.egg-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.13);border-radius:18px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;color:#fff;transition:transform .15s,border-color .25s}
.egg-card:active{transform:translateY(-4px);border-color:var(--egg-color)}
.egg-card svg{width:clamp(60px,10vh,80px);height:clamp(80px,13vh,105px)}
.egg-name{font-weight:700;font-size:14px}
.egg-trait{font-size:10px;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:8px;display:flex;align-items:center;gap:4px}
.egg-trait svg{width:12px;height:12px}

/* GAME */
#gameScreen{background:#87ceeb}
#sky{position:absolute;inset:0;transition:background 4s ease;z-index:0}
#locationScene{position:absolute;inset:0;z-index:1;pointer-events:none}
#locationScene svg{width:100%;height:100%;display:block}
#clouds{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:rgba(255,255,255,.7);border-radius:50%;filter:blur(2px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}
#stars{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity 2s;pointer-events:none}
#stars.on{opacity:1}
.star-dot{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2.5s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
#celestial{position:absolute;width:clamp(48px,8vh,68px);height:clamp(48px,8vh,68px);border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff8b0,#ffd700);box-shadow:0 0 50px #ffd700;transition:all 3s ease,opacity 2s;z-index:2}
#celestial.moon{background:radial-gradient(circle at 60% 40%,#f0f0ff,#c8c8e8);box-shadow:0 0 30px #c8c8e8}

#topbar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:clamp(8px,1.5vh,14px) clamp(8px,2vw,14px);gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:clamp(5px,1vh,8px) clamp(8px,1.5vw,12px);border-radius:20px;border:1px solid rgba(255,255,255,.5);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);font-weight:700;font-size:clamp(11px,1.5vh,13px);display:flex;align-items:center;gap:5px;cursor:pointer}
.pill:active{background:rgba(255,255,255,.6)}
.pill svg{width:16px;height:16px}
#speciesPill{font-size:clamp(10px,1.4vh,12px);cursor:default;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#petArea{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
#petContainer{position:relative;width:clamp(180px,42vh,340px);height:clamp(180px,42vh,340px);cursor:pointer;transition:transform .2s}
#petContainer:active{transform:scale(.96)}
.pet-svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2))}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.pet-body{animation:breathe 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.eyes-open{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.eyes-closed{display:none}
.mouth-sad,.mouth-neutral{display:none}
#petContainer.sleeping .eyes-open{display:none}
#petContainer.sleeping .eyes-closed{display:inline}
#petContainer.sleeping .mouth-happy,
#petContainer.sleeping .mouth-sad,
#petContainer.sleeping .mouth-neutral{display:none}
#petContainer.sleeping .pet-body{animation-duration:5s}
#petContainer.sad .mouth-happy{display:none}
#petContainer.sad .mouth-sad{display:inline}
#petContainer.neutral .mouth-happy{display:none}
#petContainer.neutral .mouth-neutral{display:inline}
#zzz{position:absolute;top:0;right:5%;opacity:0;pointer-events:none;transition:opacity .4s}
#zzz svg{width:34px;height:34px}
#petContainer.sleeping #zzz{opacity:1;animation:zzzFloat 2.4s ease-in-out infinite}
@keyframes zzzFloat{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(22px,-45px) scale(1.2);opacity:0}}
@keyframes eggWiggle{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(2.5deg)}}
.pet-svg.egg{animation:eggWiggle 3s ease-in-out infinite;transform-origin:bottom center}
#thoughtBubble{position:absolute;top:-10px;left:50%;transform:translate(-50%,-10px);background:#fff;color:#333;border-radius:18px;padding:8px 14px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:20;max-width:280px;text-align:center}
#thoughtBubble.show{opacity:1;transform:translate(-50%,0)}
#thoughtBubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}

#stats{position:relative;z-index:10;padding:0 clamp(8px,2vw,14px) 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(4px,1vh,8px);max-width:700px;margin:0 auto;width:100%}
.stat{background:rgba(255,255,255,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.55);border-radius:12px;padding:clamp(4px,1vh,8px) 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.stat svg{width:18px;height:18px}
.stat .bar{width:100%;height:clamp(4px,.8vh,6px);background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
.stat .fill{height:100%;border-radius:3px;background:#4ade80;transition:width .6s,background .6s}

#actions{position:relative;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(4px,1vh,8px);padding:clamp(6px,1vh,10px) clamp(8px,2vw,14px) clamp(12px,2vh,20px);max-width:700px;margin:0 auto;width:100%}
.action-btn{background:rgba(255,255,255,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:clamp(6px,1.5vh,12px) 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;transition:transform .1s}
.action-btn:active{transform:scale(.9);background:rgba(255,255,255,.85)}
.action-btn svg{width:clamp(20px,3vh,26px);height:clamp(20px,3vh,26px)}
.action-btn .label{font-size:clamp(7px,1vh,9px);color:#333;font-weight:800;text-transform:uppercase}
.action-btn.liked{box-shadow:0 0 0 2px #fbbf24,0 0 12px rgba(251,191,36,.6)}

.particle{position:fixed;pointer-events:none;z-index:30;animation:floatUp 1.4s ease-out forwards}
.particle svg{width:26px;height:26px;display:block}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-100px) scale(1.3)}}

/* OVERLAYS */
#overlay{position:absolute;inset:0;z-index:100;display:none;background:rgba(15,15,30,.78);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#overlay.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:popIn .3s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto;color:#333}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{font-size:20px;margin-bottom:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.panel h2 svg{width:24px;height:24px}
.btn{width:100%;padding:12px;border:none;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(102,126,234,.4);margin-bottom:8px}
.btn:active{transform:scale(.96)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn.secondary{background:#e5e7eb;color:#374151;box-shadow:none}

/* SHOP */
.shop-items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.shop-item{background:#f5f7fb;border:2px solid #e0e6f0;border-radius:14px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;position:relative}
.shop-item:active{transform:scale(.94)}
.shop-item svg{width:36px;height:36px}
.si-name{font-size:11px;font-weight:700;color:#444;text-align:center}
.si-price{font-size:11px;color:#888;display:flex;align-items:center;gap:3px}
.si-price svg{width:12px;height:12px}
.si-badge{position:absolute;top:4px;right:6px;font-size:9px;background:#4ade80;color:#fff;padding:1px 6px;border-radius:8px;font-weight:800}
.shop-item.owned{border-color:#4ade80;background:#f0fdf4}
.shop-item.equipped{border-color:#fbbf24;background:#fffbeb}

/* INVENTORY */
.inv-item{background:#f5f7fb;border:2px solid #e0e6f0;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.inv-item svg{width:32px;height:32px;flex-shrink:0}
.inv-info{flex:1}
.inv-name{font-size:13px;font-weight:700;color:#333}
.inv-count{font-size:11px;color:#888}
.inv-use{background:#4ade80;border:none;color:#fff;padding:6px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}

/* MINIGAMES */
.minigame{width:100%;max-width:480px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mg-header{display:flex;justify-content:space-between;padding:14px 18px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:700;font-size:14px;align-items:center}
.mg-header .hdr{display:flex;align-items:center;gap:4px}
.mg-header svg{width:16px;height:16px}
.mg-field{position:relative;height:clamp(320px,50vh,460px);background:linear-gradient(180deg,#1a1a3e,#2d2b55);overflow:hidden;cursor:pointer}
.mg-field::before{content:'';position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 20%,#fff,transparent);opacity:.6}
.mg-star{position:absolute;width:38px;height:38px;cursor:pointer;filter:drop-shadow(0 0 10px rgba(255,215,0,.9))}
.mg-star.caught{animation:starCatch .3s ease-out forwards;pointer-events:none}
@keyframes starCatch{to{transform:scale(2.2);opacity:0}}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px;background:linear-gradient(180deg,#1a1a3e,#2d2b55)}
.mem-card{aspect-ratio:1;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .3s;position:relative}
.mem-card::before{content:'?';font-weight:900;font-size:22px;color:#fff;opacity:.7}
.mem-card.flipped{background:#fff;color:#333}
.mem-card.flipped::before{content:none}
.mem-card svg{width:50%;height:50%}
.mem-card.matched{background:#4ade80;opacity:.6;pointer-events:none}
.mem-card.matched::before{content:none}
.tap-area{position:relative;height:clamp(320px,50vh,460px);background:linear-gradient(180deg,#1a1a3e,#2d2b55);overflow:hidden;cursor:pointer}
.tap-target{position:absolute;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 0 30px #fbbf24;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.tap-target:active{transform:scale(.9)}
.tap-target svg{width:50%;height:50%}
.tap-feedback{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:24px;font-weight:900;pointer-events:none;opacity:0;transition:opacity .2s}
.tap-feedback.show{opacity:1;animation:tapPop .5s}
@keyframes tapPop{0%{transform:translateX(-50%) scale(.5)}50%{transform:translateX(-50%) scale(1.3)}100%{transform:translateX(-50%) scale(1);opacity:0}}

/* SETTINGS */
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.1);color:#fff}
.setting-row:last-child{border-bottom:none}
.setting-row .label{font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.setting-row .label svg{width:20px;height:20px}
.switch{position:relative;width:46px;height:26px;background:rgba(255,255,255,.2);border-radius:13px;cursor:pointer;transition:background .2s}
.switch.on{background:#4ade80}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.switch.on::after{transform:translateX(20px)}
.slider{width:120px;accent-color:#fbbf24}

/* ACH / DIARY */
.ach-item{display:flex;gap:12px;padding:12px;background:rgba(255,255,255,.06);border-radius:14px;margin-bottom:8px;align-items:center;border:1px solid rgba(255,255,255,.1)}
.ach-item.locked{opacity:.4}
.ach-icon{width:44px;height:44px;flex-shrink:0;background:rgba(251,191,36,.15);border-radius:12px;display:flex;align-items:center;justify-content:center}
.ach-icon svg{width:26px;height:26px}
.ach-info{flex:1}
.ach-name{color:#fff;font-weight:700;font-size:14px;margin-bottom:2px}
.ach-desc{color:rgba(255,255,255,.65);font-size:11px}
.ach-check{width:22px;height:22px;color:#4ade80}
.diary-item{display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:6px;color:#fff;align-items:center}
.diary-icon{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.diary-icon svg{width:20px;height:20px}
.diary-text{flex:1;font-size:12px;line-height:1.4}
.diary-time{font-size:10px;opacity:.5;white-space:nowrap}

/* PAUSE */
#pauseMenu{background:linear-gradient(160deg,#2d2b55,#1a1a2e);color:#fff}
#pauseMenu h2{color:#fff}
.pause-btn{width:100%;padding:14px;margin-bottom:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:14px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:12px}
.pause-btn:active{background:rgba(255,255,255,.22)}
.pause-btn svg{width:22px;height:22px}
.pause-btn.danger{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.4);color:#fca5a5}

/* LOCATION PICKER */
.loc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.loc-card{background:#f5f7fb;border:2px solid #e0e6f0;border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;transition:transform .1s,border-color .2s}
.loc-card:active{transform:scale(.94)}
.loc-card.active{border-color:#fbbf24;background:#fffbeb}
.loc-preview{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#ccc}
.loc-preview svg{width:100%;height:100%;display:block}
.loc-name{font-size:12px;font-weight:700;color:#444}
</style>
</head>

  <body>
<div id="app">

  <div class="screen active" id="mainMenu">
    <div id="menuLogo"></div>
    <h1>Тамагочи</h1>
    <p class="subtitle">Reborn · 5.1</p>
    <button class="menu-btn primary" id="btnNewGame"><span id="icoNew"></span>Новая игра</button>
    <button class="menu-btn" id="btnContinue" disabled><span id="icoCont"></span>Продолжить</button>
    <button class="menu-btn" id="btnSettingsMenu"><span id="icoSet"></span>Настройки</button>
  </div>

  <div class="screen dark-screen" id="saveSlots">
    <div class="screen-header"><button class="back-btn" data-back="mainMenu"><span id="icoBack1"></span></button><h2>Сохранения</h2></div>
    <div class="screen-body" id="slotsBody"></div>
  </div>

  <div class="screen" id="eggSelect">
    <div class="screen-header" style="color:#fff"><button class="back-btn" data-back="mainMenu"><span id="icoBack2"></span></button><h2>Выбери яйцо</h2></div>
    <p style="color:rgba(255,255,255,.7);text-align:center;font-size:13px;padding:0 20px 8px">Из него вылупится твой питомец</p>
    <div class="egg-grid" id="eggGrid"></div>
  </div>

function shade(hex,pct){
  const n=parseInt(hex.replace('#',''),16);
  let r=Math.max(0,Math.min(255,(n>>16)+Math.round(2.55*pct)));
  let g=Math.max(0,Math.min(255,((n>>8)&0xff)+Math.round(2.55*pct)));
  let b=Math.max(0,Math.min(255,(n&0xff)+Math.round(2.55*pct)));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

let _petUid = 0;

function renderPet(species, stage, branch, clothes){
  _petUid++;
  const uid = _petUid;
  // ПАТЧ #4: стадия 0 — настоящее яйцо
  if (stage === 0) {
    const egg = buildEggSVG(species);
    return egg.replace('<svg ', '<svg class="pet-svg egg" ');
  }
  const fn = { cat:catPet, dragon:dragonPet, frog:frogPet, fox:foxPet }[species];
  if (!fn) return '';
  const base = fn(stage, branch === 'good', branch === 'bad', uid);
  if (!clothes || !Object.keys(clothes).length) return base;
  let overlay = '';
  ['glasses','hat','scarf'].forEach(slot => {
    const cid = clothes[slot];
    if (cid && CLOTHES[cid]) overlay += CLOTHES[cid].svg();
  });
  if (!overlay) return base;
  // ПАТЧ #1: regex, устойчив к пробелам
  return base.replace(/(<\/g><\/g>\s*<\/svg>)/, overlay + '$1');
}

let audioCtx = null, melodyIdx = 0;
let settings = { sound: true, music: true, volume: 0.7 };
const SETTINGS_KEY = 'tamagotchi_settings_v5';
const SLOT_KEY = i => 'tamagotchi_slot_v5_' + i;

function loadSettings(){ try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)); if(s)Object.assign(settings,s);}catch(e){} }
function saveSettings(){ try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(e){} }

function initAudio(){
  if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;} }
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function tone(freq,dur,type='sine',vol=0.08,delay=0){
  if(!audioCtx || !settings.sound) return;
  const t=audioCtx.currentTime+delay, osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol*settings.volume,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur+0.05);
}

let state = null, currentSlot = null, loopRunning = false, lastFrame = performance.now();
let uiAcc = 0, thoughtAcc = 0, thoughtTimer = null, actionLock = false;
const $ = id => document.getElementById(id);
const petContainer = $('petContainer');
const thoughtBubble = $('thoughtBubble');
const overlay = $('overlay');

function defaultState(species){
  return {
    species, branch: null,
    hunger:75, energy:75, hygiene:80, happiness:75, health:100,
    coins:100, ageSec:0, stage:0, sleeping:false,
    time:8*60, lastTick:Date.now(), createdAt:Date.now(),
    stats:{ feeds:0, washes:0, sleeps:0, pets:0, gamesPlayed:0, totalStars:0, purchases:0 },
    achievements:{},
    diary:[],
    inventory:{},
    clothes:{},
    ownedClothes:[],
    houseLevel:0,
    location:'yard'
  };
}

function saveGame(){
  if(!state || currentSlot===null) return;
  state.lastTick=Date.now();
  try{ localStorage.setItem(SLOT_KEY(currentSlot), JSON.stringify({state, savedAt:Date.now()})); }catch(e){}
}
function loadGame(slot){
  try{
    const raw=localStorage.getItem(SLOT_KEY(slot));
    if(!raw) return null;
    const d=JSON.parse(raw);
    if(!d.state || !SPECIES[d.state.species]) return null;
    return d;
  }catch(e){ return null; }
}
function deleteGame(slot){ try{localStorage.removeItem(SLOT_KEY(slot));}catch(e){} }
function getAllSlots(){ return [0,1,2].map(i=>({slot:i, data:loadGame(i)})); }
function findEmptySlot(){ for(let i=0;i<3;i++) if(!loadGame(i)) return i; return -1; }

function applyOfflineDecay(){
  const elapsed=(Date.now()-(state.lastTick||Date.now()))/1000;
  if(elapsed>5 && elapsed<7200){
    const t=Math.min(elapsed,3600);
    state.hunger=Math.max(0,state.hunger-t*0.15);
    state.hygiene=Math.max(0,state.hygiene-t*0.1);
    state.happiness=Math.max(0,state.happiness-t*0.12);
    if(!state.sleeping) state.energy=Math.max(0,state.energy-t*0.1);
    state.ageSec+=t;
  }
  state.lastTick=Date.now();
  state.stage=stageForAge(state.ageSec);
}

function determineBranch(){
  const s=state.stats;
  const total=s.feeds+s.washes+s.pets+s.gamesPlayed;
  const avg=(state.hunger+state.energy+state.hygiene+state.happiness+state.health)/5;
  return (total>=25 && avg>=55) ? 'good' : 'bad';
}

function addDiary(iconKey, text){
  if(!state) return;
  state.diary.unshift({ icon:iconKey, text, time:Date.now() });
  if(state.diary.length>50) state.diary=state.diary.slice(0,50);
}

function checkAchievements(){
  if(!state) return;
  let newAch=false;
  ACHIEVEMENTS.forEach(ach => {
    if(state.achievements[ach.id]) return;
    if(ach.check(state)){
      state.achievements[ach.id]=Date.now();
      addDiary('trophy', `Достижение: ${ach.name}`);
      newAch=true;
      setTimeout(()=>{ if(state) showBubble(`Достижение! ${ach.name}`); }, 500);
    }
  });
  if(newAch){ playSound('ach'); spawnParticles('trophy', 3); }
}

// ============ UI HELPERS ============
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = $(id);
  if(el) el.classList.add('active');
  if(id==='saveSlots') renderSlots();
  else if(id==='achievementsScreen') renderAchievements();
  else if(id==='diaryScreen') renderDiary();
  else if(id==='mainMenu') refreshContinueBtn();
  if(id !== 'gameScreen') stopGameLoop();
  if(id === 'gameScreen' && state) startGameLoop();
}

function closeOverlay(){ overlay.classList.remove('show'); overlay.innerHTML=''; }

function showBubble(text, ms=2500){
  thoughtBubble.textContent=text;
  thoughtBubble.classList.add('show');
  clearTimeout(thoughtTimer);
  thoughtTimer=setTimeout(()=>thoughtBubble.classList.remove('show'), ms);
}

function spawnParticles(iconKey, count=4){
  const rect=petContainer.getBoundingClientRect();
  if(rect.width===0) return;
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='particle';
    el.innerHTML=ICONS[iconKey]||ICONS.sparkle;
    el.style.left=(rect.left+rect.width*(0.2+Math.random()*0.6))+'px';
    el.style.top=(rect.top+rect.height*(0.2+Math.random()*0.5))+'px';
    el.style.animationDelay=(i*0.08)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1600);
  }
}

function refreshPetBody(){
  if(!state) return;
  petContainer.querySelectorAll('.pet-svg').forEach(el => el.remove());
  petContainer.insertAdjacentHTML('afterbegin', renderPet(state.species, state.stage, state.branch, state.clothes));
  const sp=SPECIES[state.species];
  let label=sp.name;
  if(state.stage>=4 && state.branch) label = state.branch==='good' ? sp.adultGood.name : sp.adultBad.name;
  if(state.stage===5) label+=' ⭐';
  $('speciesPill').textContent = label;
  document.querySelectorAll('.action-btn').forEach(btn => {
    btn.classList.toggle('liked', btn.dataset.action===sp.like);
  });
  $('sleepIco').innerHTML = state.sleeping ? ICONS.wake : ICONS.sleep;
  // ПАТЧ #3: локация вместо #house/#ground
  const loc = LOCATIONS[state.location] || LOCATIONS.yard;
  $('locationScene').innerHTML = loc.render(state.houseLevel || 0);
  $('locName').textContent = loc.name;
}

function initStars(){
  const stars=$('stars'); stars.innerHTML='';
  for(let i=0;i<40;i++){
    const s=document.createElement('div');
    s.className='star-dot';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*60+'%';
    s.style.animationDelay=Math.random()*3+'s';
    stars.appendChild(s);
  }
  const clouds=$('clouds'); clouds.innerHTML='';
  for(let i=0;i<4;i++){
    const c=document.createElement('div');
    c.className='cloud';
    const w=60+Math.random()*80;
    c.style.width=w+'px'; c.style.height=(w*0.5)+'px';
    c.style.top=(5+Math.random()*25)+'%';
    c.style.animationDuration=(40+Math.random()*30)+'s';
    c.style.animationDelay=(-Math.random()*60)+'s';
    clouds.appendChild(c);
  }
}

function updateSky(){
  if(!state) return;
  const h=(state.time%1440)/60;
  let bg, isNight=false;
  if(h<5){ bg='linear-gradient(180deg,#0f0c29,#302b63,#24243e)'; isNight=true; }
  else if(h<7) bg='linear-gradient(180deg,#ff9a9e,#fecfef,#a8d8ea)';
  else if(h<17) bg='linear-gradient(180deg,#87ceeb,#b0e0e6,#e0f7ff)';
  else if(h<19) bg='linear-gradient(180deg,#ff9a9e,#fad0c4,#ffd1ff)';
  else { bg='linear-gradient(180deg,#1a1a2e,#16213e,#0f3460)'; isNight=true; }
  $('sky').style.background=bg;
  const isIndoor = state.location==='home';
  $('stars').classList.toggle('on', isNight && !isIndoor);
  $('celestial').style.opacity = isIndoor ? '0' : '1';
  $('clouds').style.opacity = (isNight || isIndoor) ? '0.15' : '1';
  let progress;
  if(h>=6 && h<18) progress=(h-6)/12;
  else { const hh=h>=18?h-18:h+6; progress=hh/12; }
  const x=8+progress*84;
  const y=55-Math.sin(progress*Math.PI)*42;
  const cel=$('celestial');
  cel.style.left=`calc(${x}% - 28px)`;
  cel.style.top=`calc(${y}% - 28px)`;
  cel.classList.toggle('moon', isNight);
  const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  $('clock').textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}

function barColor(v){ return v>60?'#4ade80':v>30?'#fbbf24':'#ef4444'; }

function updateStatsUI(){
  if(!state) return;
  ['hunger','energy','hygiene','happiness','health'].forEach(k => {
    const el = document.querySelector(`.stat[data-stat="${k}"] .fill`);
    if(!el) return;
    const v = Math.max(0, Math.min(100, state[k]));
    el.style.width = v + '%';
    el.style.background = barColor(v);
  });
  $('coinVal').textContent = state.coins;
}

function updateMood(){
  if(!state) return;
  petContainer.classList.toggle('sleeping', state.sleeping);
  const avg = (state.hunger + state.happiness + state.health) / 3;
  let cls = '';
  if(avg < 35 || state.health < 40) cls = 'sad';
  else if(avg < 60) cls = 'neutral';
  petContainer.classList.remove('sad','neutral');
  if(cls) petContainer.classList.add(cls);
}

function think(force){
  if(!state) return;
  if(state.sleeping){ showBubble('Zzz...'); return; }
  const th = THOUGHTS[state.species];
  const msgs = [];
  if(state.hunger < 30) msgs.push(...th.hungry);
  if(state.energy < 30) msgs.push(...th.tired);
  if(state.hygiene < 30) msgs.push(...th.dirty);
  if(state.happiness < 30) msgs.push(...th.bored);
  if(state.health < 40) msgs.push(...th.sick);
  if(msgs.length === 0) msgs.push(...th.happy);
  if(force || Math.random() < 0.5) showBubble(msgs[Math.floor(Math.random() * msgs.length)]);
}

// ============ ДЕЙСТВИЯ ============
function feed(){
  if(!state) return;
  if(state.sleeping){ showBubble('Тсс... я сплю'); playSound('sleep'); return; }
  if(actionLock) return; actionLock=true; setTimeout(()=>actionLock=false, 600);
  const foodInInv = Object.keys(state.inventory).find(k => FOOD_ITEMS.find(f=>f.id===k) && state.inventory[k] > 0);
  if(foodInInv){ feedFromInv(foodInInv); return; }
  showBubble('Нет еды в сумке!');
  openShop('food');
}

function feedFromInv(id){
  if(!state) return;
  const item = FOOD_ITEMS.find(f => f.id === id);
  if(!item || !state.inventory[id]) return;
  state.inventory[id]--;
  if(state.inventory[id] <= 0) delete state.inventory[id];
  state.hunger = Math.min(100, state.hunger + (item.satiety || 0));
  state.health = Math.min(100, state.health + (item.health || 0));
  state.happiness = Math.min(100, state.happiness + (item.happy || 0));
  state.energy = Math.min(100, state.energy + (item.energy || 0));
  state.stats.feeds++;
  playSound('feed');
  spawnParticles('apple', 4);
  showBubble(`Съел: ${item.name}!`);
  saveGame(); updateStatsUI(); updateMood(); checkAchievements();
}

function toggleSleep(){
  if(!state) return;
  state.sleeping = !state.sleeping;
  if(state.sleeping) state.stats.sleeps++;
  playSound(state.sleeping ? 'sleep' : 'click');
  showBubble(state.sleeping ? 'Сладких снов...' : 'Проснулся!');
  refreshPetBody();
  saveGame(); updateMood();
}

function wash(){
  if(!state) return;
  if(state.sleeping){ showBubble('Тсс... я сплю'); playSound('sleep'); return; }
  if(actionLock) return; actionLock=true; setTimeout(()=>actionLock=false, 600);
  const isLiked = SPECIES[state.species].like === 'wash';
  state.hygiene = Math.min(100, state.hygiene + (isLiked ? 60 : 40));
  state.energy = Math.max(0, state.energy - 3);
  state.stats.washes++;
  playSound(isLiked ? 'happy' : 'wash');
  spawnParticles('wash', 6);
  showBubble(isLiked ? 'Как же хорошо!' : 'Как свежо!');
  saveGame(); updateStatsUI(); updateMood(); checkAchievements();
}

function petThePet(){
  if(!state) return;
  if(state.sleeping){ showBubble('Zzz...'); return; }
  state.happiness = Math.min(100, state.happiness + 4);
  state.coins = Math.min(9999, state.coins + 1);
  state.stats.pets++;
  playSound('click');
  spawnParticles('heart', 3);
  if(Math.random() < 0.4) showBubble('Муррр (+1 монета)');
  saveGame(); updateStatsUI(); updateMood(); checkAchievements();
}

// ============ МАГАЗИН ============
function openShop(initialTab='food'){
  if(!state) return;
  playSound('click');
  let currentTab = initialTab;

  function render(){
    let items = '';
    if(currentTab === 'food'){
      items = FOOD_ITEMS.map(it => {
        const owned = state.inventory[it.id] || 0;
        return `<div class="shop-item" data-buy="${it.id}" data-type="food">
          ${owned>0?`<div class="si-badge">×${owned}</div>`:''}
          ${ICONS[it.icon] || ICONS.apple}
          <span class="si-name">${it.name}</span>
          <span class="si-price">${ICONS.coin}${it.price}</span>
        </div>`;
      }).join('');
    } else if(currentTab === 'clothes'){
      items = Object.keys(CLOTHES).map(id => {
        const c = CLOTHES[id];
        const owned = state.ownedClothes.includes(id);
        const equipped = state.clothes[c.slot] === id;
        return `<div class="shop-item ${equipped?'equipped':owned?'owned':''}" data-buy="${id}" data-type="clothes">
          ${ICONS.hat}
          <span class="si-name">${c.name}</span>
          <span class="si-price">${owned?(equipped?'Надето':'Куплено'):ICONS.coin+c.price}</span>
        </div>`;
      }).join('');
    } else if(currentTab === 'house'){
      items = HOUSE_LEVELS.map((h,i) => {
        const owned = i <= state.houseLevel;
        return `<div class="shop-item ${owned?'owned':''}" data-buy="house${i}" data-type="house">
          ${ICONS.houseIco}
          <span class="si-name">${h.name}</span>
          <span class="si-price">${owned?(i===state.houseLevel?'Активен':'Куплено'):ICONS.coin+h.price}</span>
        </div>`;
      }).join('');
    }

    overlay.innerHTML = `<div class="panel">
      <h2>${ICONS.shop}Магазин</h2>
      <div class="tabs">
        <button class="tab ${currentTab==='food'?'active':''}" data-tab="food">${ICONS.feed}Еда</button>
        <button class="tab ${currentTab==='clothes'?'active':''}" data-tab="clothes">${ICONS.hat}Одежда</button>
        <button class="tab ${currentTab==='house'?'active':''}" data-tab="house">${ICONS.houseIco}Дом</button>
      </div>
      <div class="shop-items">${items}</div>
      <p style="text-align:center;font-size:12px;color:#666;margin-bottom:10px">Баланс: <b style="color:#f59e0b">${ICONS.coin}${state.coins}</b></p>
      <button class="btn secondary close-btn">Закрыть</button>
    </div>`;
    overlay.classList.add('show');

    overlay.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => { currentTab = t.dataset.tab; render(); };
    });
    overlay.querySelectorAll('.shop-item').forEach(b => {
      b.onclick = () => {
        const type = b.dataset.type, id = b.dataset.buy;
        if(type === 'food'){
          const it = FOOD_ITEMS.find(f => f.id === id);
          if(state.coins < it.price){ playSound('sad'); showBubble('Мало монет'); return; }
          state.coins -= it.price;
          state.inventory[id] = (state.inventory[id] || 0) + 1;
          state.stats.purchases++;
          playSound('happy');
          addDiary('shop', `Куплено: ${it.name}`);
          saveGame(); updateStatsUI(); render();
        } else if(type === 'clothes'){
          const cc = CLOTHES[id];
          if(state.ownedClothes.includes(id)){
            if(state.clothes[cc.slot] === id){ delete state.clothes[cc.slot]; playSound('click'); }
            else { state.clothes[cc.slot] = id; playSound('happy'); }
            refreshPetBody(); saveGame(); render();
          } else {
            if(state.coins < cc.price){ playSound('sad'); showBubble('Мало монет'); return; }
            state.coins -= cc.price;
            state.ownedClothes.push(id);
            state.clothes[cc.slot] = id;
            state.stats.purchases++;
            playSound('happy');
            addDiary('shop', `Куплено: ${cc.name}`);
            refreshPetBody(); saveGame(); updateStatsUI(); checkAchievements(); render();
          }
        } else if(type === 'house'){
          const i = +id.replace('house','');
          if(i <= state.houseLevel) return;
          const h = HOUSE_LEVELS[i];
          if(state.coins < h.price){ playSound('sad'); showBubble('Мало монет'); return; }
          state.coins -= h.price;
          state.houseLevel = i;
          state.stats.purchases++;
          playSound('levelup');
          addDiary('houseIco', `Дом улучшен: ${h.name}`);
          refreshPetBody(); saveGame(); updateStatsUI(); checkAchievements(); render();
        }
      };
    });
    overlay.querySelector('.close-btn').onclick = closeOverlay;
  }
  render();
}

// ============ ИНВЕНТАРЬ ============
function openInventory(){
  if(!state) return;
  playSound('click');
  const items = Object.keys(state.inventory).filter(k => state.inventory[k] > 0);
  let foodHtml = '';
  if(items.length === 0){
    foodHtml = '<p style="text-align:center;color:#999;padding:20px">Сумка пуста. Купи еду в магазине!</p>';
  } else {
    foodHtml = items.map(id => {
      const item = FOOD_ITEMS.find(f => f.id === id);
      if(!item) return '';
      return `<div class="inv-item">${ICONS[item.icon]||ICONS.apple}<div class="inv-info"><div class="inv-name">${item.name}</div><div class="inv-count">×${state.inventory[id]}</div></div><button class="inv-use" data-use="${id}">Исп.</button></div>`;
    }).join('');
  }
  const clothesHtml = state.ownedClothes.map(id => {
    const cc = CLOTHES[id];
    if(!cc) return '';
    const equipped = state.clothes[cc.slot] === id;
    return `<div class="inv-item">${ICONS.hat}<div class="inv-info"><div class="inv-name">${cc.name}</div><div class="inv-count">${cc.slot}</div></div><button class="inv-use" data-equip="${id}">${equipped?'Снять':'Надеть'}</button></div>`;
  }).join('');

  overlay.innerHTML = `<div class="panel">
    <h2>${ICONS.bag}Сумка</h2>
    <h3 style="font-size:14px;color:#666;margin:10px 0 6px">Еда</h3>
    ${foodHtml}
    ${clothesHtml ? `<h3 style="font-size:14px;color:#666;margin:14px 0 6px">Одежда</h3>${clothesHtml}` : ''}
    <button class="btn secondary close-btn" style="margin-top:14px">Закрыть</button>
  </div>`;
  overlay.classList.add('show');
  overlay.querySelectorAll('[data-use]').forEach(b => {
    b.onclick = () => { const id = b.dataset.use; closeOverlay(); feedFromInv(id); };
  });
  overlay.querySelectorAll('[data-equip]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.equip, cc = CLOTHES[id];
      if(state.clothes[cc.slot] === id) delete state.clothes[cc.slot];
      else state.clothes[cc.slot] = id;
      playSound('click'); refreshPetBody(); saveGame(); openInventory();
    };
  });
  overlay.querySelector('.close-btn').onclick = closeOverlay;
}

  overlay.innerHTML = `<div class="panel">

function startStarsGame(){
  if(!state) return;
  overlay.innerHTML = `<div class="minigame">
    <div class="mg-header">
      <span class="hdr">${ICONS.sparkle}Лови звёзды</span>
      <span class="hdr">${ICONS.coin}<b id="mgScore">0</b></span>
      <span class="hdr">${ICONS.clock}<b id="mgTime">20</b></span>
    </div>
    <div class="mg-field" id="mgField"></div>
  </div>`;
  overlay.classList.add('show');
  const field = $('mgField');
  let score=0, timeLeft=20, running=true;
  const stars = [];
  let lastT = performance.now();

  function spawn(){
    if(!running) return;
    const el = document.createElement('div');
    el.className = 'mg-star';
    el.innerHTML = ICONS.sparkle;
    const fw = field.clientWidth || 300;
    el.style.left = (10 + Math.random()*(fw-46)) + 'px';
    el.style.top = '-40px';
    field.appendChild(el);
    stars.push({ el, y:-40, vy:70 + Math.random()*90, caught:false });
  }
  const spawnInt = setInterval(spawn, 400);
  const timerInt = setInterval(() => {
    timeLeft--;
    const t = $('mgTime'); if(t) t.textContent = timeLeft;
    if(timeLeft <= 0) end();
  }, 1000);

  function mgLoop(now){
    if(!running) return;
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    for(let i = stars.length-1; i >= 0; i--){
      const s = stars[i];
      if(s.caught) continue;
      s.y += s.vy * dt;
      s.el.style.top = s.y + 'px';
      if(s.y > field.clientHeight){ s.el.remove(); stars.splice(i,1); }
    }
    requestAnimationFrame(mgLoop);
  }
  requestAnimationFrame(mgLoop);

  field.addEventListener('click', e => {
    const tgt = e.target.closest('.mg-star');
    if(!tgt) return;
    const s = stars.find(x => x.el === tgt);
    if(!s || s.caught) return;
    s.caught = true; score++;
    const sc = $('mgScore'); if(sc) sc.textContent = score;
    tgt.classList.add('caught');
    playSound('coin');
    setTimeout(() => tgt.remove(), 320);
  });

  function end(){
    running = false;
    clearInterval(spawnInt); clearInterval(timerInt);
    stars.forEach(s => s.el.remove());
    if(!state){ closeOverlay(); return; }
    const reward = score * 2;
    state.coins += reward;
    state.happiness = Math.min(100, state.happiness + score * 2);
    state.energy = Math.max(0, state.energy - 10);
    state.stats.gamesPlayed++;
    state.stats.totalStars += score;
    playSound('levelup');
    addDiary('play', `Игра «Звёзды»: ${score} звёзд`);
    saveGame(); updateStatsUI(); updateMood(); checkAchievements();
    overlay.innerHTML = `<div class="panel" style="text-align:center">
      <h2>Молодец!</h2>
      <p style="font-size:15px;color:#555;margin:6px 0">Звёзд: <b style="color:#667eea">${score}</b></p>
      <p style="font-size:15px;color:#555;margin:6px 0">Монет: <b style="color:#667eea">+${reward}</b></p>
      <button class="btn" id="mgClose">Отлично!</button>
    </div>`;
    $('mgClose').onclick = closeOverlay;
  }
}

function startMemoryGame(){
  if(!state) return;
  const icons = ['apple','cake','coffee','soap','toy','med','heart','sparkle'];
  const deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
  overlay.innerHTML = `<div class="minigame">
    <div class="mg-header">
      <span class="hdr">${ICONS.play}Память</span>

    </div>
    <div class="mem-grid" id="memGrid"></div>
  </div>`;
  overlay.classList.add('show');
  const grid = $('memGrid');
  let flipped = [], matched = 0, lock = false, timeLeft = 45, running = true;

  deck.forEach((ic, i) => {
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.dataset.icon = ic;
    card.dataset.idx = i;
    card.innerHTML = ICONS[ic] || ICONS.sparkle;
    grid.appendChild(card);
    card.onclick = () => {
      if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      flipped.push(card);
      playSound('click');
      if(flipped.length === 2){
        lock = true;
        if(flipped[0].dataset.icon === flipped[1].dataset.icon){
          setTimeout(() => {
            flipped.forEach(c => { c.classList.remove('flipped'); c.classList.add('matched'); });
            matched++;
            const sc = $('mgScore'); if(sc) sc.textContent = matched + '/8';
            playSound('happy');
            flipped = []; lock = false;
            if(matched === 8) end();
          }, 300);
        } else {
          playSound('wrong');
          setTimeout(() => {
            flipped.forEach(c => c.classList.remove('flipped'));
            flipped = []; lock = false;
          }, 700);
        }
      }
    };
  });

  const timerInt = setInterval(() => {
    timeLeft--;
    const t = $('mgTime'); if(t) t.textContent = timeLeft;
    if(timeLeft <= 0) end();
  }, 1000);

  function end(){
    if(!running) return;
    running = false;
    clearInterval(timerInt);
    if(!state){ closeOverlay(); return; }
    const reward = matched * 10;
    state.coins += reward;
    state.happiness = Math.min(100, state.happiness + matched * 3);
    state.energy = Math.max(0, state.energy - 10);
    state.stats.gamesPlayed++;
    playSound('levelup');
    addDiary('play', `Игра «Память»: ${matched}/8 пар`);
    saveGame(); updateStatsUI(); updateMood(); checkAchievements();
    overlay.innerHTML = `<div class="panel" style="text-align:center">
      <h2>Память!</h2>
      <p style="font-size:15px;color:#555;margin:6px 0">Пар: <b style="color:#667eea">${matched}/8</b></p>

      <button class="btn" id="mgClose">Отлично!</button>
    </div>`;

  }
}

function renderSlots(){
  const body = $('slotsBody');

    if(!data){
      return `<div class="slot-card empty" data-slot="${slot}"><span style="font-size:14px;opacity:.7">Пустой слот ${slot+1}</span></div>`;
    }
    const st = data.state;
    const sp = SPECIES[st.species];
    const stageLabel = STAGES[st.stage].label;
    const date = new Date(data.savedAt || st.lastTick);
    const dateStr = date.toLocaleDateString('ru') + ' ' + date.toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'});
    return `<div class="slot-card" data-slot="${slot}">

        <div class="name">${sp.name}</div>

      </div>
      <button class="slot-delete" data-del="${slot}">${ICONS.trash}</button>
    </div>`;
  }).join('');

  slots.forEach(({slot, data}) => {
    if(!data) return;
    const prev = body.querySelector(`[data-preview="${slot}"]`);
    if(prev){
      prev.innerHTML = renderPet(data.state.species, data.state.stage, data.state.branch, data.state.clothes);
      const svgEl = prev.querySelector('svg');
      if(svgEl){ svgEl.style.width='100%'; svgEl.style.height='100%'; }
    }
  });

  body.querySelectorAll('.slot-card').forEach(card => {
    card.addEventListener('click', e => {
      if(e.target.closest('.slot-delete')) return;
      initAudio(); playSound('click');
      const slot = +card.dataset.slot;
      const data = loadGame(slot);
      if(data){ enterGame(slot, data.state); }
      else { currentSlot = slot; renderEggGrid(); showScreen('eggSelect'); }
    });
  });
  body.querySelectorAll('.slot-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const slot = +btn.dataset.del;
      if(confirm('Удалить сохранение?')){
        deleteGame(slot); playSound('sad'); renderSlots(); refreshContinueBtn();
      }
    });
  });
}

// ============ СТАРТ НОВОЙ ИГРЫ ============
function startNewGame(speciesId){
  if(currentSlot === null || currentSlot === undefined) currentSlot = findEmptySlot();
  if(currentSlot === -1){ alert('Все слоты заняты.'); showScreen('mainMenu'); return; }
  state = defaultState(speciesId);
  addDiary('sparkle', `Появился ${SPECIES[speciesId].name}!`);
  saveGame();
  enterGame(currentSlot, state);
}

function enterGame(slot, st){
  currentSlot = slot;
  state = st;
  // Миграция
  if(!state.stats) state.stats = { feeds:0, washes:0, sleeps:0, pets:0, gamesPlayed:0, totalStars:0, purchases:0 };
  if(!state.achievements) state.achievements = {};
  if(!state.diary) state.diary = [];
  if(!state.inventory) state.inventory = {};
  if(!state.clothes) state.clothes = {};
  if(!state.ownedClothes) state.ownedClothes = [];
  if(state.houseLevel === undefined) state.houseLevel = 0;
  if(!state.location || !LOCATIONS[state.location]) state.location = 'yard';
  if(state.branch === undefined) state.branch = null;

  if(state.lastTick) applyOfflineDecay();
  state.stage = stageForAge(state.ageSec);
  if(state.stage >= 4 && !state.branch) state.branch = determineBranch();
  refreshPetBody(); updateStatsUI(); updateSky(); updateMood();
  showScreen('gameScreen');
  setTimeout(() => {
    if(state){
      if(state.stage === 0) showBubble(`Привет! Скоро вылуплюсь!`);
      else if(state.stage === 1) showBubble(`Привет! Я ${SPECIES[state.species].name.toLowerCase()}`);
      else showBubble('Как я вырос!');
      checkAchievements();
    }
  }, 600);
  saveGame();
}

// ============ ИГРОВОЙ ЦИКЛ ============
function startGameLoop(){
  if(loopRunning) return;
  loopRunning = true;
  lastFrame = performance.now();
  requestAnimationFrame(gameLoop);
}

function stopGameLoop(){ loopRunning = false; }

function gameLoop(now){
  if(!loopRunning) return;
  if(!state){ loopRunning = false; return; }
  const dt = Math.min((now - lastFrame) / 1000, 2);
  lastFrame = now;
  if(!overlay.classList.contains('show')) update(dt);
  requestAnimationFrame(gameLoop);
}

function update(dt){
  if(!state) return;
  state.time = (state.time + dt * 2) % 1440;
  state.ageSec += dt;

  const newStage = stageForAge(state.ageSec);
  if(newStage !== state.stage){
    state.stage = newStage;
    if(newStage >= 4){
      state.branch = determineBranch();
      const sp = SPECIES[state.species];
      const nm = state.branch === 'good' ? sp.adultGood.name : sp.adultBad.name;
      showBubble(`Я вырос! ${nm}!`);
      addDiary('trophy', `Эволюция: ${nm}`);
    } else {
      showBubble(`Теперь я ${STAGES[newStage].label.toLowerCase()}!`);
      addDiary('sparkle', `Эволюция: ${STAGES[newStage].label}`);
    }
    playSound('levelup');
    spawnParticles('sparkle', 8);
    refreshPetBody();
    checkAchievements();
  }

  if(state.sleeping){
    state.energy = Math.min(100, state.energy + dt * 0.9);
    state.hunger = Math.max(0, state.hunger - dt * 0.06);
    state.hygiene = Math.max(0, state.hygiene - dt * 0.04);
    state.happiness = Math.max(0, state.happiness - dt * 0.04);
    if(state.energy >= 100){
      state.sleeping = false;
      refreshPetBody();
      showBubble('Выспался!');
      playSound('happy');
    }
  } else {
    state.hunger = Math.max(0, state.hunger - dt * 0.15);
    state.energy = Math.max(0, state.energy - dt * 0.1);
    state.hygiene = Math.max(0, state.hygiene - dt * 0.1);
    state.happiness = Math.max(0, state.happiness - dt * 0.12);
  }

  const crit = (state.hunger<20?1:0) + (state.hygiene<20?1:0) + (state.happiness<20?1:0);
  if(crit >= 2) state.health = Math.max(0, state.health - dt * 0.35);
  else if(state.hunger>50 && state.hygiene>50) state.health = Math.min(100, state.health + dt * 0.08);

  uiAcc += dt;
  if(uiAcc >= 0.25){ uiAcc = 0; updateStatsUI(); updateSky(); updateMood(); }

  thoughtAcc += dt;
  if(thoughtAcc > 12){ thoughtAcc = 0; think(true); }

  // Автосохранение раз в 10 сек
  const secNow = Math.floor(state.ageSec);
  if(secNow % 10 === 0 && secNow !== Math.floor(state.ageSec - dt)){
    saveGame();
    checkAchievements();
  }
}

  $('icoBack5').innerHTML = ICONS.back;
  $('icoClock').innerHTML = ICONS.clock;
  $('icoLoc').innerHTML = ICONS.map;
  $('icoCoin1').innerHTML = ICONS.coin;
  $('icoMenu').innerHTML = ICONS.menu;
  $('icoSound').innerHTML = ICONS.sound;
  $('icoMusic').innerHTML = ICONS.music;
  $('icoVol').innerHTML = ICONS.volume;
  $('zzz').innerHTML = ICONS.zzz;
  document.querySelector('[data-stat="hunger"] .sico').innerHTML = ICONS.hunger;
  document.querySelector('[data-stat="energy"] .sico').innerHTML = ICONS.energy;
  document.querySelector('[data-stat="hygiene"] .sico').innerHTML = ICONS.hygiene;
  document.querySelector('[data-stat="happiness"] .sico').innerHTML = ICONS.happiness;
  document.querySelector('[data-stat="health"] .sico').innerHTML = ICONS.health;
  document.querySelector('[data-action="feed"] .aico').innerHTML = ICONS.feed;
  document.querySelector('[data-action="sleep"] .aico').innerHTML = ICONS.sleep;
  document.querySelector('[data-action="wash"] .aico').innerHTML = ICONS.wash;
  document.querySelector('[data-action="games"] .aico').innerHTML = ICONS.games;
  document.querySelector('[data-action="shop"] .aico').innerHTML = ICONS.shop;
  document.querySelector('[data-action="inventory"] .aico').innerHTML = ICONS.bag;
  $('menuLogo').innerHTML = renderPet('cat', 4, 'good', {});
  const logoSvg = $('menuLogo').querySelector('svg');
  if(logoSvg){ logoSvg.style.width = '100%'; logoSvg.style.height = '100%'; }
}

function refreshContinueBtn(){
  const hasAny = getAllSlots().some(s => s.data);
  $('btnContinue').disabled = !hasAny;
}

// ============ ОБРАБОТЧИКИ ============
function setupMainMenu(){
  $('btnNewGame').onclick = () => {
    initAudio(); playSound('click');
    const empty = findEmptySlot();
    if(empty === -1){ alert('Все слоты заняты.'); return; }
    currentSlot = empty;
    renderEggGrid();
    showScreen('eggSelect');
  };
  $('btnContinue').onclick = () => { initAudio(); playSound('click'); showScreen('saveSlots'); };
  $('btnSettingsMenu').onclick = () => {
    initAudio(); playSound('click');
    $('settingsScreen').dataset.fromGame = '';
    renderSettingsUI();
    showScreen('settingsScreen');
  };
  document.querySelectorAll('[data-back]').forEach(btn => {
    btn.onclick = () => { playSound('click'); showScreen(btn.dataset.back); };
  });
  $('achBack').onclick = () => { playSound('click'); if(state) showScreen('gameScreen'); else showScreen('mainMenu'); };
  $('diaryBack').onclick = () => { playSound('click'); if(state) showScreen('gameScreen'); else showScreen('mainMenu'); };
}

function setupActions(){
  document.querySelectorAll('.action-btn').forEach(btn => {
    btn.onclick = () => {
      initAudio();
      if(!state) return;
      const a = btn.dataset.action;
      if(a === 'feed') feed();
      else if(a === 'sleep') toggleSleep();
      else if(a === 'wash') wash();
      else if(a === 'games') openGamesMenu();
      else if(a === 'shop') openShop('food');
      else if(a === 'inventory') openInventory();
    };
  });
  petContainer.onclick = () => { initAudio(); if(state) petThePet(); };
  $('menuBtn').onclick = () => { if(state) openPauseMenu(); };
  $('locPill').onclick = () => { if(state) openLocationPicker(); };
  document.addEventListener('touchstart', initAudio, { once: true });
  document.addEventListener('mousedown', initAudio, { once: true });
  window.addEventListener('beforeunload', () => { if(state) saveGame(); });
  document.addEventListener('visibilitychange', () => { if(document.hidden && state) saveGame(); });
}

// ============ ИНИЦИАЛИЗАЦИЯ ============
function init(){
  loadSettings();
  populateIcons();
  initStars();
  setupMainMenu();
  setupActions();
  setupSettingsHandlers();
  refreshContinueBtn();
  renderSettingsUI();
  setInterval(() => {
    if(state && $('gameScreen').classList.contains('active')) saveGame();
  }, 8000);
}

init();
})();
</script>
